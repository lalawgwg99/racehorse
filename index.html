<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天駒養成錄｜馬王之路</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  body { background: #0e2a1a; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  .turf-bg { background: linear-gradient(180deg, #14532d 0%, #0e2a1a 100%); }
  .card { background: #fdfbf3; border: 1px solid #d8cbb3; border-radius: 1rem; }
  .gold-btn { background: linear-gradient(180deg, #f6c453, #d9941a); color: #3a2503; font-weight: 800; border-radius: .75rem; box-shadow: 0 2px 0 #9c6b21; }
  .gold-btn:active { transform: translateY(1px); box-shadow: none; }
  .green-btn { background: linear-gradient(180deg, #2f9e63, #1d6b41); color: #fff; font-weight: 800; border-radius: .75rem; box-shadow: 0 2px 0 #14532d; }
  .green-btn:active { transform: translateY(1px); box-shadow: none; }
  .ink-btn { background: #1e1a16; color: #fdfbf3; font-weight: 800; border-radius: .75rem; }
  .paper-btn { background: #f4ede0; color: #5c5346; font-weight: 700; border: 1px solid #d8cbb3; border-radius: .75rem; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .7rem 0 calc(.8rem + env(safe-area-inset-bottom)); min-height: 64px; font-size: 13px; font-weight: 800; color: #b8a686; text-align: center; }
  .nav-btn.active { color: #f6c453; }
  .nav-ico { font-size: 24px; line-height: 1; }
  .stat-bar { height: .5rem; background: #e6dcc5; border-radius: 999px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 999px; transition: width .3s; }
  .mood-4 { color: #d9941a; } .mood-3 { color: #1d6b41; } .mood-2 { color: #5c5346; } .mood-1 { color: #9e2a22; } .mood-0 { color: #9e2a22; }
  .race-lane { display: flex; align-items: center; gap: .4rem; margin-bottom: .45rem; }
  .race-track { flex: 1; height: 1.4rem; background: #e6dcc5; border-radius: 999px; position: relative; overflow: hidden; }
  .race-runner { position: absolute; top: 0; left: 0; height: 100%; border-radius: 999px; transition: width .2s linear; display: flex; align-items: center; padding-left: .4rem; font-size: 11px; font-weight: 800; color: #fff; white-space: nowrap; }
  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .race-scene { position: relative; border-radius: 1rem; overflow: hidden; background-image: url('assets/race-track.webp'); background-size: cover; background-position: center 72%; border: 1px solid #d8cbb3; }
  .race-lane-row { position: relative; height: 2.2rem; border-bottom: 1px dashed rgba(255,255,255,.55); }
  .race-lane-row:last-child { border-bottom: none; }
  .race-token { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 1.9rem; height: 1.9rem; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); background: #fdfbf3; }
  .race-token.me { width: 2.2rem; height: 2.2rem; border-color: #d9941a; overflow: hidden; padding: 0; }
  .race-token.me img { width: 100%; height: 100%; object-fit: cover; }
  .race-token.bob { animation: bob .45s ease-in-out infinite alternate; }
  @keyframes bob { from { margin-top: 0; } to { margin-top: -3px; } }
  .race-flag { position: absolute; right: 2px; top: 0; bottom: 0; width: 3px; background: repeating-linear-gradient(180deg, #1e1a16 0 8px, #fff 8px 16px); z-index: 3; }
  .lane-name { position: absolute; left: 4px; top: 50%; transform: translateY(-50%); font-size: 10px; font-weight: 800; background: rgba(255,255,255,.88); border-radius: 999px; padding: 1px 6px; z-index: 2; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-pos { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); z-index: 2; }
  .float-text { animation: floatUp 1.2s ease forwards; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-24px); } }
</style>
</head>
<body class="turf-bg min-h-screen text-[#1e1a16]">
<div class="max-w-md mx-auto min-h-screen flex flex-col pb-20">

  <!-- 頂部資源列 -->
  <header class="sticky top-0 z-20 px-3 pt-3 pb-2" style="background:rgba(14,42,26,.95)">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-[#f6c453] font-black text-lg leading-none">🐎 天駒養成錄</div>
        <div id="header-season" class="text-[#b8d8a8] text-xs mt-1">第 1 年・第 1 週</div>
      </div>
      <div class="text-right flex items-start gap-2">
        <div>
          <div id="header-money" class="text-[#f6c453] font-black text-lg leading-none">💰 100,000</div>
          <div id="header-horses" class="text-[#b8d8a8] text-xs mt-1">馬房 1/6</div>
        </div>
        <button id="btn-mute" type="button" class="text-xl leading-none px-2 py-1.5 rounded-lg" style="background:rgba(246,196,83,.15)" title="音效開關">🔊</button>
      </div>
    </div>
    <div id="toast-banner" class="hidden mt-2 text-center text-xs font-bold text-[#3a2503] bg-[#f6c453] rounded-lg px-3 py-2"></div>

  <main class="flex-1 px-3 space-y-3 pb-6">

    <section id="view-stable" class="space-y-3">
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <h2 class="font-black text-base">🏇 馬房</h2>
          <span id="stable-count" class="text-xs font-bold text-[#5c5346]"></span>
        </div>
        <div id="stable-list" class="space-y-2 mt-2"></div>
      </div>
      <div id="horse-detail" class="card p-4"></div>
      <div id="equip-panel" class="card p-4"></div>
      <div id="breed-panel" class="card p-4"></div>
    </section>

    <!-- 育成 -->
    <section id="view-train" class="space-y-3 hidden">
      <div class="card p-4">
        <h2 class="font-black text-base">🌱 育成 <span class="text-xs font-bold text-[#5c5346]">每週選一項行動</span></h2>

    <!-- 比賽 -->
    <section id="view-race" class="space-y-3 hidden">

    <!-- 商店 -->
    <section id="view-shop" class="space-y-3 hidden">

          <h2 class="font-black text-base">🛒 馬匹市場</h2>
          <button id="btn-refresh-shop" type="button" class="paper-btn text-xs px-3 py-1.5">換一批（本週免費）</button>

    <!-- 名人堂 -->

      <div class="card p-4">
        <h2 class="font-black text-base">📊 牧場紀錄</h2>

  <!-- 底部導覽 -->
  <nav class="fixed bottom-0 left-0 right-0 z-20" style="background:#0a1f13">
    <div class="max-w-md mx-auto flex">
      <button type="button" class="nav-btn active" data-view="stable"><span class="nav-ico">🏇</span><span>馬房</span></button>
      <button type="button" class="nav-btn" data-view="train"><span class="nav-ico">🌱</span><span>育成</span></button>
      <button type="button" class="nav-btn" data-view="race"><span class="nav-ico">🏆</span><span>比賽</span></button>
      <button type="button" class="nav-btn" data-view="shop"><span class="nav-ico">🛒</span><span>商店</span></button>
      <button type="button" class="nav-btn" data-view="hall"><span class="nav-ico">👑</span><span>名人堂</span></button>
    </div>

</div>

<script>
'use strict';
/* ================= 資料 ================= */
const STORAGE_KEY = 'tianju_save_v1';
const MAX_STABLE = 6;
const STAT_KEYS = ['spd', 'sta', 'pow', 'gut', 'wis'];
const STAT_LABEL = { spd: '速度', sta: '耐力', pow: '力量', gut: '根性', wis: '智慧' };
const MOOD_LABEL = ['極差', '不調', '普通', '好調', '絕好調'];
const RARITY = {
  common: { label: '普通', cap: 70, color: '#5c5346', priceBase: 15000 },
  good:   { label: '良血', cap: 80, color: '#1d6b41', priceBase: 40000 },
  noble:  { label: '名門', cap: 90, color: '#1d4ed8', priceBase: 100000 },
  legend: { label: '傳奇', cap: 99, color: '#d9941a', priceBase: 250000 },
};
const RACES = [
  { id: 'maiden', name: '新馬戰', tier: '新馬', minWins: 0, minAge: 2, prize: 30000, dist: 1200, distType: '短', turf: '草', oppBase: 42 },
  { id: 'cond',   name: '條件戰', tier: '條件', minWins: 1, minAge: 2, prize: 50000, dist: 1600, distType: '中', turf: '草', oppBase: 60 },
  { id: 'open',   name: '公開賽', tier: '公開', minWins: 2, minAge: 2, prize: 100000, dist: 1800, distType: '中', turf: '草', oppBase: 72 },
  { id: 'g3',     name: 'G3・青葉賞', tier: 'G3', minWins: 3, minAge: 3, prize: 300000, dist: 2000, distType: '中', turf: '草', oppBase: 82 },
  { id: 'g2',     name: 'G2・天駒盃', tier: 'G2', minWins: 4, minAge: 3, prize: 600000, dist: 2200, distType: '長', turf: '草', oppBase: 90 },
  { id: 'g1',     name: 'G1・天駒大賞', tier: 'G1', minWins: 5, minAge: 3, prize: 1200000, dist: 2400, distType: '長', turf: '草', oppBase: 98 },
];
const NAME_A = ['烈風', '追風', '雷霆', '疾風', '星月', '雪影', '烈焰', '龍騰', '虎嘯', '金駒', '銀蹄', '赤兔', '玄風', '青雲', '白駒', '紫電', '金光', '飛燕', '破曉', '晨光', '夜鷹', '海浪', '山嵐', '火鳳', '冰霜', '狂風', '閃電', '流星', '彩虹', '黑豹'];
const NAME_B = ['號', '之星', '王者', '傳奇', '疾風', '飛馳', '旋風', '雄心', '戰士', '小子', '公主', '王子'];
const OPP_NAMES = ['疾風迅雷', '草原之風', '鐵蹄無敵', '月光寶駒', '烈焰戰馬', '銀河快駒', '王者之風', '黑旋風', '白龍馬', '赤兔二世', '雷霆萬鈞', '追月流星', '金甲神駒', '風馳電掣'];
const EQUIP_SLOTS = {
  saddle: { label: '馬鞍', stats: ['spd', 'sta'] },
  shoes: { label: '蹄鐵', stats: ['spd', 'pow'] },
  bridle: { label: '韁繩', stats: ['wis', 'gut'] },
  blinkers: { label: '眼罩', stats: ['gut', 'spd'] },
};
const EQUIP_TIERS = {
  rough: { label: '粗製', bonus: 2, color: '#5c5346', price: 5000 },
  fine: { label: '精良', bonus: 4, color: '#1d6b41', price: 15000 },
  master: { label: '名匠', bonus: 7, color: '#1d4ed8', price: 40000 },
  legend: { label: '傳奇', bonus: 10, color: '#d9941a', price: 100000 },
};
const JOCKEY_GRADES = {
  rookie: { label: '見習', spd: 2, wis: 0, gut: 0, fee: 10000, raceFee: 500 },
  normal: { label: '普通', spd: 3, wis: 2, gut: 0, fee: 30000, raceFee: 1000 },
  elite: { label: '精英', spd: 5, wis: 3, gut: 2, fee: 80000, raceFee: 2000 },
  ace: { label: '王牌', spd: 8, wis: 5, gut: 3, fee: 200000, raceFee: 5000 },
};
const JOCKEY_NAMES = ['陳志遠', '林小龍', '阿哲', '大樹', '小馬哥', '阿凱', '志豪', '俊傑', '阿明', '家豪', '柏翰', '子軒', '冠宇', '建宏', '文彬', '阿翔'];
const BREED_COST = 30000;
const BET_AMOUNTS = [1000, 5000, 10000, 50000];

/* ================= 工具 ================= */
function $(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function uid() { return 'h' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ================= 音效（WebAudio 合成，無外部檔案） ================= */
let audioCtx = null;
function isMuted() {
  try { return localStorage.getItem('tianju_muted') === '1'; } catch (e) { return false; }
}
function setMuted(m) {
  try { localStorage.setItem('tianju_muted', m ? '1' : '0'); } catch (e) { /* 忽略 */ }
  const btn = $('btn-mute');
  if (btn) btn.textContent = m ? '🔇' : '🔊';
}
function tone(freq, dur, type, vol, when) {
  const AC = (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext));
  if (!AC || isMuted()) return;
  try {
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (when || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  } catch (e) { /* 瀏覽器不支援就靜音 */ }
}
function sfx(kind) {
  if (isMuted()) return;
  if (kind === 'tap') tone(660, 0.07, 'square', 0.05);
  else if (kind === 'train') { tone(520, 0.09, 'sine', 0.1); tone(780, 0.12, 'sine', 0.1, 0.09); }
  else if (kind === 'coin') { tone(950, 0.08, 'sine', 0.12); tone(1420, 0.16, 'sine', 0.12, 0.08); }
  else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.14, i * 0.11)); }
  else if (kind === 'lose') { tone(320, 0.2, 'sine', 0.1); tone(210, 0.3, 'sine', 0.1, 0.18); }
  else if (kind === 'whistle') { tone(2200, 0.12, 'sine', 0.07); tone(2200, 0.2, 'sine', 0.07, 0.16); }
  else if (kind === 'foal') { tone(880, 0.1, 'triangle', 0.1); tone(1175, 0.1, 'triangle', 0.1, 0.1); tone(1568, 0.2, 'triangle', 0.1, 0.2); }
  else if (kind === 'count') tone(880, 0.09, 'sine', 0.1);
  else if (kind === 'go') { tone(1047, 0.2, 'triangle', 0.14); tone(1568, 0.3, 'triangle', 0.12, 0.12); }
}

/* ================= 狀態 ================= */
let state = null;
let currentView = 'stable';
let racing = false;

function genHorseName(existing) {
  for (let i = 0; i < 50; i++) {
    const n = randPick(NAME_A) + randPick(NAME_B);
    if (!existing.includes(n)) return n;
  }
  return randPick(NAME_A) + '號' + randInt(2, 99);
}
function rollRarity() {
  const r = Math.random();
  if (r < 0.45) return 'common';
  if (r < 0.75) return 'good';
  if (r < 0.93) return 'noble';
  return 'legend';
}
function rarityStatRange(rarity) {
  if (rarity === 'common') return [25, 45];
  if (rarity === 'good') return [35, 55];
  if (rarity === 'noble') return [45, 65];
  return [55, 75];
}
const PERSONAS = [
  { name: '萬年老三', desc: '總是差一點點就贏', weak: 'big', weakLabel: '大賽緊張（G1/G2 -6）' },
  { name: '短跑快槍手', desc: '起跑無人能敵，後段沒力', weak: 'long', weakLabel: '長距離苦手（長 -6）' },
  { name: '長途苦行僧', desc: '越跑越有勁', weak: 'short', weakLabel: '短距離苦手（短 -6）' },
  { name: '草地貴族', desc: '只認草地', weak: 'mud', weakLabel: '泥地苦手（泥 -6）' },
  { name: '大賽型選手', desc: '越大的舞台越興奮', weak: 'small', weakLabel: '小比賽提不起勁（新馬/條件/公開 -6）' },
  { name: '慢熱型', desc: '後段才開始加速', weak: 'tired', weakLabel: '體力低於 50 時 -6' },
];
function personaOf(h) { return PERSONAS.find(x => x.name === h.persona) || null; }
function genPersona(h) {
  const p = randPick(PERSONAS);
  h.persona = p.name;
  let rival = randPick(OPP_NAMES);
  for (let i = 0; i < 20 && rival === h.name; i++) rival = randPick(OPP_NAMES);
  h.rival = rival;
}
function weakPenalty(h, race) {
  const p = personaOf(h);
  if (!p || !race) return 0;
  if (p.weak === 'mud' && race.turf === '泥') return 6;
  if (p.weak === 'short' && race.distType === '短') return 6;
  if (p.weak === 'long' && race.distType === '長') return 6;
  if (p.weak === 'big' && (race.tier === 'G1' || race.tier === 'G2')) return 6;
  if (p.weak === 'small' && race.tier !== 'G1' && race.tier !== 'G2' && race.tier !== 'G3') return 6;
  if (p.weak === 'tired' && h.energy < 50) return 6;
  return 0;
}
function newHorse(opts) {
  opts = opts || {};
  const rarity = opts.rarity || rollRarity();
  const range = rarityStatRange(rarity);
  const stats = {};
  STAT_KEYS.forEach(k => { stats[k] = randInt(range[0], range[1]); });
  const r = Math.random();
  const turf = r < 0.60 ? '草' : (r < 0.85 ? '泥' : '兩用');
  const d = Math.random();
  const dist = d < 0.30 ? '短' : (d < 0.75 ? '中' : '長');
  const horse = {
    id: opts.id || uid(),
    name: opts.name || genHorseName((state ? state.horses : []).map(h => h.name)),
    age: opts.age || 2,
    sex: Math.random() < 0.5 ? '公' : '母',
    rarity: rarity,
    stats: stats,
    energy: 100,
    mood: 2,
    turf: turf,
    dist: dist,
    wins: 0,
    races: 0,
    earnings: 0,
    g1wins: 0,
    g2wins: 0,
    g3wins: 0,
    retired: false,
    equipment: {},
  };
  genPersona(horse);
  return horse;
}
function horsePrice(h) {
  const base = RARITY[h.rarity].priceBase;
  const sum = STAT_KEYS.reduce((s, k) => s + h.stats[k], 0);
  return base + sum * 300;
}
function genShopHorse() {
  const h = newHorse();
  h.price = horsePrice(h);
  return h;
}
function rollEquipTier() {
  const r = Math.random();
  if (r < 0.55) return 'rough';
  if (r < 0.80) return 'fine';
  if (r < 0.95) return 'master';
  return 'legend';
}
function genEquipment(slot, tier) {
  slot = slot || randPick(Object.keys(EQUIP_SLOTS));
  tier = tier || rollEquipTier();
  const t = EQUIP_TIERS[tier];
  const stats = EQUIP_SLOTS[slot].stats;
  const b1 = Math.ceil(t.bonus / 2), b2 = t.bonus - b1;
  const bonuses = {};
  bonuses[stats[0]] = b1;
  bonuses[stats[1]] = b2;
  return {
    id: uid(),
    slot: slot,
    tier: tier,
    name: t.label + EQUIP_SLOTS[slot].label,
    bonuses: bonuses,
    price: t.price + randInt(0, 2000),
  };
}
function genJockey(grade) {
  if (!grade) {
    const r = Math.random();
    grade = r < 0.5 ? 'rookie' : (r < 0.8 ? 'normal' : (r < 0.95 ? 'elite' : 'ace'));
  }
  const taken = ((state && state.jockeys ? state.jockeys : []).concat((state && state.shopJockeys) || [])).map(j => j.name);
  let name = randPick(JOCKEY_NAMES);
  for (let i = 0; i < 20 && taken.includes(name); i++) name = randPick(JOCKEY_NAMES);
  return { id: uid(), name: name, grade: grade, level: 1, exp: 0, bond: 0 };
}
function jockeyBonus(j) {
  const g = JOCKEY_GRADES[j.grade];
  const lv = j.level - 1;
  const b = { spd: g.spd + lv, wis: g.wis + Math.floor(lv / 2), gut: g.gut + Math.floor(lv / 2) };
  if ((j.bond || 0) >= 80) { b.spd *= 2; b.wis *= 2; b.gut *= 2; }
  return b;
}
function activeJockey() {
  if (!state || !state.jockeys) return null;
  return state.jockeys.find(j => j.id === state.activeJockeyId) || null;
}
function effStats(h) {
  const st = Object.assign({}, h.stats);
  if (h.equipment) Object.values(h.equipment).forEach(it => {
    if (!it) return;
    Object.keys(it.bonuses || {}).forEach(k => { st[k] = clamp((st[k] || 0) + it.bonuses[k], 10, 99); });
  });
  const j = activeJockey();
  if (j) {
    const b = jockeyBonus(j);
    Object.keys(b).forEach(k => { st[k] = clamp((st[k] || 0) + b[k], 10, 99); });
  }
  return st;
}
function migrateState() {
  if (!state.equipment) state.equipment = [];
  if (!state.shopEquip) state.shopEquip = [genEquipment(), genEquipment()];
  if (!state.jockeys || !state.jockeys.length) {
    const j = genJockey('rookie');
    state.jockeys = [j];
    state.activeJockeyId = j.id;
  }
  if (!state.shopJockeys) state.shopJockeys = [genJockey(), genJockey()];
  if (state.pendingBet === undefined) state.pendingBet = null;
  if (state.legacyPoints === undefined) state.legacyPoints = 0;
  (state.jockeys || []).forEach(j => { if (j.bond === undefined) j.bond = 0; });
  (state.shopJockeys || []).forEach(j => { if (j.bond === undefined) j.bond = 0; });
  state.horses.forEach(h => { if (!h.equipment) h.equipment = {}; if (!h.persona) genPersona(h); });
}
function createDefaultState() {

function activeHorse() {

}

let toastTimer = null;

/* ================= 育成 ================= */
function statCap(h) { return RARITY[h.rarity].cap; }
function trainFailRate(h, statKey) {
  return Math.min(0.20, 0.08 + 0.12 * (h.stats[statKey] / statCap(h)));
}
function trainGain(h, statKey, base) {
  let mult = 1 - 0.6 * (h.stats[statKey] / statCap(h));
  if (h.lastTrain === statKey) mult *= 0.75;
  return Math.max(1, Math.round(base * mult));
}
function doTrain(statKey) {
  const h = activeHorse();
  if (!h || h.retired) { showToast('請先在馬房選一匹現役馬'); return; }
  if (h.energy < 22) { showToast('體力不足，先休息或餵食'); return; }
  h.energy = clamp(h.energy - 22, 0, 100);
  if (Math.random() < trainFailRate(h, statKey)) {
    h.energy = clamp(h.energy - 10, 0, 100);
    h.mood = clamp(h.mood - 1, 0, 4);
    addLog(h.name + '訓練失敗，狀態有點低落…（體力 -10）');
    showToast('訓練失敗！' + h.name + '有點低落');
  } else {
    let gain = trainGain(h, statKey, randInt(2, 4) + (h.mood >= 3 ? 1 : 0));
    const cap = statCap(h);
    const before = h.stats[statKey];
    h.stats[statKey] = clamp(h.stats[statKey] + gain, 10, cap);
    const real = h.stats[statKey] - before;
    addLog(h.name + STAT_LABEL[statKey] + '訓練：' + before + ' → ' + h.stats[statKey] + (real < gain ? '（已達' + RARITY[h.rarity].label + '上限 ' + cap + '）' : '') + (h.lastTrain === statKey ? '（連續同項，效果打折）' : '') + '，體力 -22');
    showToast(STAT_LABEL[statKey] + ' +' + real + '！');
    sfx('train');
  }
  h.lastTrain = statKey;
  afterAction();
}
function doRest() {
  const h = activeHorse();
  if (!h || h.retired) { showToast('請先在馬房選一匹現役馬'); return; }
  const before = h.energy;
  h.energy = clamp(h.energy + 35, 0, 100);
  addLog(h.name + '好好休息了一週，體力 ' + before + ' → ' + h.energy);
  showToast('體力 +' + (h.energy - before));
  sfx('tap');
  afterAction();
}
function doWalk() {
  const h = activeHorse();
  if (!h || h.retired) { showToast('請先在馬房選一匹現役馬'); return; }
  const beforeMood = h.mood;
  h.mood = clamp(h.mood + 1, 0, 4);
  h.energy = clamp(h.energy + 12, 0, 100);
  addLog(h.name + '去草地散步，心情 ' + MOOD_LABEL[beforeMood] + ' → ' + MOOD_LABEL[h.mood] + '，體力 +12');
  showToast('心情變成「' + MOOD_LABEL[h.mood] + '」');
  afterAction();
}
function doFeed() {
  const h = activeHorse();
  if (!h || h.retired) { showToast('請先在馬房選一匹現役馬'); return; }
  if (state.money < 800) { showToast('金不夠，特級飼料要 800 金'); return; }
  state.money -= 800;
  h.energy = clamp(h.energy + 25, 0, 100);
  const key = randPick(STAT_KEYS);
  const before = h.stats[key];
  h.stats[key] = clamp(h.stats[key] + 1, 10, statCap(h));
  addLog(h.name + '吃了特級飼料（-800 金），體力 +25，' + STAT_LABEL[key] + ' ' + before + ' → ' + h.stats[key]);
  showToast('體力 +25，' + STAT_LABEL[key] + ' +1');
  sfx('coin');
  afterAction();
}

/* ================= 週次推進 ================= */
function weeklyEvent(h) {
  if (Math.random() > 0.12 || !h) return;
  const roll = Math.random();
  if (roll < 0.3) {
    state.money += 5000;
    addLog('🎉 贊助商來訪！' + h.name + '登上地方報，贊助金 +5,000');
    showToast('贊助金 +5,000！');
  } else if (roll < 0.55) {
    h.mood = 4;
    addLog('☀️ ' + h.name + '今天精神特別好，心情變成絕好調！');
  } else if (roll < 0.75) {
    const key = randPick(STAT_KEYS);
    h.stats[key] = clamp(h.stats[key] + 2, 10, statCap(h));
    addLog('💡 ' + h.name + '突然開竅了，' + STAT_LABEL[key] + ' +2！');
  } else if (roll < 0.88) {
    h.energy = clamp(h.energy - 20, 0, 100);
    addLog('🤧 ' + h.name + '有點小感冒，體力 -20');
  } else {
    h.mood = clamp(h.mood - 1, 0, 4);
    addLog('🌧 ' + h.name + '被雷聲嚇到，心情 -1');
  }
}
function advanceWeek() {
  state.week += 1;
  if (state.week > 52) {
    state.week = 1;
    state.year += 1;
    state.horses.forEach(h => {
      if (h.retired) return;
      h.age += 1;
      if (h.age >= 5) {
        STAT_KEYS.forEach(k => { h.stats[k] = clamp(h.stats[k] - 3, 10, 99); });
        addLog('🍂 ' + h.name + ' ' + h.age + ' 歲了，巔峰已過，全屬性 -3');
      }
      if (h.age >= 7) {
        h.retired = true;
        addLog('👋 ' + h.name + ' 7 歲引退了，感謝牠的付出！可以在馬房賣出或留作紀念。');
        const lp = 1 + (h.wins >= 5 ? 1 : 0) + (h.g1wins > 0 ? 1 : 0);
        state.legacyPoints = (state.legacyPoints || 0) + lp;
        addLog('🧬 ' + h.name + '留下 ' + lp + ' 個血統點（勝場 ' + h.wins + '、G1 ' + h.g1wins + ' 次），可在馬房傳承給現役馬！');
        if (h.g1wins > 0) {
          state.hall.push({ name: h.name, g1wins: h.g1wins, wins: h.wins, earnings: h.earnings });
        }
      }
    });
    showToast('進入第 ' + state.year + ' 年！');
  }
  state.shop = [genShopHorse(), genShopHorse(), genShopHorse()];
  state.shopEquip = [genEquipment(), genEquipment()];
  state.shopJockeys = [genJockey(), genJockey()];
  state.shopFreeRefresh = true;
}
function afterAction() {
  const h = activeHorse();
  weeklyEvent(h);
  advanceWeek();
  saveState();
  renderAll();
}

/* ================= 比賽 ================= */
function calcPower(h, race) {
  const s = effStats(h);
  let base = s.spd * 0.35 + s.sta * 0.25 + s.pow * 0.15 + s.gut * 0.15 + s.wis * 0.10;
  let fit = 1;
  if (race.turf === '草') fit *= (h.turf === '草' ? 1.10 : (h.turf === '兩用' ? 1.05 : 0.85));
  else fit *= (h.turf === '泥' ? 1.10 : (h.turf === '兩用' ? 1.05 : 0.85));
  fit *= (h.dist === race.distType ? 1.10 : 0.90);
  const moodMult = [0.90, 0.95, 1.0, 1.05, 1.10][h.mood];
  return Math.max(1, base * fit * moodMult - weakPenalty(h, race));
}
function genOpponent(race, name) {
  const p = race.oppBase + randInt(-8, 8);
  return { name: name, power: p, isPlayer: false };
}
function calcRaceOutcome(h, race) {
  const runners = [{ name: h.name, power: calcPower(h, race), isPlayer: true }];
  const pool = OPP_NAMES.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  for (let i = 0; i < 7; i++) runners.push(genOpponent(race, pool[i]));
  runners.forEach(r => { r.eff = r.power * (0.92 + Math.random() * 0.16); });
  runners.sort((a, b) => b.eff - a.eff);
  runners.forEach((r, i) => { r.rank = i + 1; });
  const me = runners.find(r => r.isPlayer);
  return { runners: runners, myRank: me.rank };
}
function raceEligible(h, race) {
  if (!h || h.retired) return '請先選一匹現役馬';
  if (h.age < race.minAge) return '要 ' + race.minAge + ' 歲才能參加';
  if (h.wins < race.minWins) return '需要 ' + race.minWins + ' 勝才能報名';
  if (h.energy < 25) return '體力不足 25，先休息';
  return null;
}
function raceCommentAt(prog, leaderName) {
  if (prog >= 0.75) return '最後直線！名次藏起來了，「' + leaderName + '」領先，但誰會贏還不知道！';
  if (prog >= 0.6) return '進入彎道，「' + leaderName + '」暫時領先！';
  if (prog >= 0.3) return '中段，各馬展開爭奪！';
  return '閘門開了！各馬衝出起跑線！';
}
function lossTip(h, race, gap) {
  if (h.mood <= 2) return '心情' + MOOD_LABEL[h.mood] + '，先散步或休息把心情養起來，下次更好跑。';
  const key = race.distType === '長' ? 'sta' : (race.distType === '短' ? 'spd' : (h.stats.spd <= h.stats.sta ? 'spd' : 'sta'));
  return STAT_LABEL[key] + '再練高一點就能追上（與冠軍差約 ' + gap + ' 戰力）。';
}
function spendLegacy(statKey) {
  const h = activeHorse();
  if (!h || h.retired) { showToast('請先選一匹現役馬'); return; }
  if ((state.legacyPoints || 0) < 1) { showToast('沒有血統點，先讓一匹馬引退'); return; }
  const cap = statCap(h);
  if (h.stats[statKey] >= cap) { showToast(STAT_LABEL[statKey] + '已到上限'); return; }
  state.legacyPoints -= 1;
  const before = h.stats[statKey];
  h.stats[statKey] = clamp(h.stats[statKey] + 5, 10, cap);
  addLog('🧬 血統傳承：' + h.name + STAT_LABEL[statKey] + ' ' + before + ' → ' + h.stats[statKey] + '（血統點 -1，剩 ' + state.legacyPoints + '）');
  showToast(STAT_LABEL[statKey] + ' +' + (h.stats[statKey] - before) + '！');
  sfx('coin');
  saveState();
  renderAll();
}
let raceAnim = null;
function skipRace() {
  if (!raceAnim || raceAnim.done) return;
  raceAnim.done = true;
  raceAnim.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
  raceAnim.onFinish();
}
function startRaceAnimation(race, outcome, onFinish) {
  raceAnim = { done: false, timers: [], onFinish: onFinish };
  const live = $('race-live');
  live.classList.remove('hidden');
  const counts = ['3', '2', '1', '跑！'];
  let ci = 0;
  live.innerHTML = '<div class="text-center py-10"><div id="count-num" class="text-7xl font-black text-[#1d4d2e]">3</div><div class="text-sm text-[#5c5346] mt-2">預備…</div></div>'
    + '<div class="text-center"><button type="button" id="btn-skip-race" class="paper-btn text-xs px-3 py-1.5">⏩ 跳過比賽</button></div>';
  live.scrollIntoView({ behavior: 'smooth', block: 'center' });
  sfx('count');
  const wireSkip = () => { const b = $('btn-skip-race'); if (b) b.addEventListener('click', skipRace); };
  wireSkip();
  const cdTimer = setInterval(() => {
    ci++;
    if (ci >= counts.length) { clearInterval(cdTimer); sfx('go'); runScene(); return; }
    const el = $('count-num');
    if (el) el.textContent = counts[ci];
    sfx('count');
  }, 1000);
  raceAnim.timers.push(cdTimer);
  function runScene() {
    live.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・' + race.dist + 'm ' + race.turf + '地進行中…</h2>'
      + '<div class="text-center mt-2"><button type="button" id="btn-skip-race" class="paper-btn text-xs px-3 py-1.5">⏩ 跳過比賽</button></div>'
      + '<div class="race-scene mt-3"><div class="race-flag"></div>' + outcome.runners.map((r, i) =>
        '<div class="race-lane-row"><span class="lane-name">' + esc(r.name) + '</span>'
        + '<div class="race-token' + (r.isPlayer ? ' me bob' : ' bob') + '" id="lane-' + i + '" style="left:6%">' + (r.isPlayer ? '<img src="assets/horse-bay.webp" alt="">' : '🐎') + '</div>'
        + '<span class="lane-pos" id="lane-pos-' + i + '">-</span></div>').join('') + '</div>'
      + '<div id="race-comment" class="text-sm font-bold text-[#1d4d2e] mt-2">閘門開了！各馬衝出起跑線！</div>';
    wireSkip();
    const maxEff = Math.max.apply(null, outcome.runners.map(r => r.eff));
    const minEff = Math.min.apply(null, outcome.runners.map(r => r.eff));
    const durs = outcome.runners.map(r => Math.min(7000, 5200 * (maxEff / r.eff)));
    const maxDur = 5200 * (maxEff / minEff);
    const startAt = Date.now();
    outcome.runners.forEach((r, i) => {
      const tok = $('lane-' + i);
      if (tok) { tok.style.transition = 'left ' + durs[i] + 'ms linear'; requestAnimationFrame(() => { tok.style.left = '92%'; }); }
    });
    const posTimer = setInterval(() => {
      const elapsed = Date.now() - startAt;
      const prog = durs.map(d => clamp(elapsed / d, 0, 1));
      const overall = clamp(elapsed / Math.min(7000, maxDur), 0, 1);
      const leaderIdx = prog.map((p, j) => ({ j: j, p: p })).sort((a, b) => b.p - a.p)[0].j;
      const comment = $('race-comment');
      if (comment) comment.textContent = raceCommentAt(overall, outcome.runners[leaderIdx].name);
      outcome.runners.forEach((r, i) => {
        const pos = $('lane-pos-' + i);
        if (!pos) return;
        if (overall >= 0.75) { pos.textContent = '？'; return; }
        const cur = prog.map((p, j) => ({ j: j, p: p })).sort((a, b) => b.p - a.p).findIndex(x => x.j === i) + 1;
        pos.textContent = '第' + cur + '名';
      });
    }, 200);
    raceAnim.timers.push(posTimer);
    const to = setTimeout(() => {
      clearInterval(posTimer);
      if (raceAnim.done) return;
      raceAnim.done = true;
      onFinish();
    }, Math.min(7000, maxDur) + 700);
    raceAnim.timers.push(to);
  }
}
function runRace(raceId) {
  if (racing) return;
  const race = RACES.find(r => r.id === raceId);
  const h = activeHorse();
  const err = raceEligible(h, race);
  if (err) { showToast(err); return; }
  racing = true;
  sfx('whistle');
  h.energy = clamp(h.energy - 25, 0, 100);
  const jock = activeJockey();
  if (jock) {
    const fee = JOCKEY_GRADES[jock.grade].raceFee;
    if (state.money < fee) { showToast('金不夠付騎師出賽費 ' + fmt(fee)); racing = false; h.energy = clamp(h.energy + 25, 0, 100); return; }
    state.money -= fee;
  }
  const outcome = calcRaceOutcome(h, race);
  startRaceAnimation(race, outcome, () => { finishRace(h, race, outcome); racing = false; });
}
function finishRace(h, race, outcome) {
  const rank = outcome.myRank;
  let prize = 0;
  if (rank === 1) prize = race.prize;
  else if (rank === 2) prize = Math.round(race.prize * 0.4);
  else if (rank === 3) prize = Math.round(race.prize * 0.2);
  h.races += 1;
  state.totalRaces += 1;
  if (rank === 1) {
    h.wins += 1;
    state.totalWins += 1;
    if (race.tier === 'G1') h.g1wins += 1;
    if (race.tier === 'G2') h.g2wins += 1;
    if (race.tier === 'G3') h.g3wins += 1;
    h.mood = clamp(h.mood + 1, 0, 4);
  } else {
    h.mood = clamp(h.mood - 1, 0, 4);
  }
  h.earnings += prize;
  state.totalEarnings += prize;
  state.money += prize;
  const jock2 = activeJockey();
  if (jock2) {
    jock2.exp += (rank === 1 ? 50 : 30);
    while (jock2.exp >= 100) { jock2.exp -= 100; jock2.level += 1; addLog('🎖️ 騎師' + jock2.name + '升級到 Lv' + jock2.level + '！'); }
    const beforeBond = jock2.bond || 0;
    jock2.bond = clamp(beforeBond + (rank === 1 ? 15 : 8), 0, 100);
    if (beforeBond < 80 && jock2.bond >= 80) addLog('💛 騎師' + jock2.name + '羈絆滿 80！進入彩圈狀態，加成翻倍！');
  }
  if (rank === 1 && Math.random() < 0.35) {
    const dropTier = race.tier === 'G1' ? (Math.random() < 0.3 ? 'legend' : 'master') : (race.tier === 'G2' ? (Math.random() < 0.3 ? 'master' : 'fine') : undefined);
    const drop = genEquipment(undefined, dropTier);
    state.equipment.push(drop);
    addLog('🎁 ' + h.name + '奪冠獲得裝備「' + drop.name + '」！');
  }
  if (state.pendingBet && state.pendingBet.raceId === race.id) {
    const b = state.pendingBet;
    let winAmt = 0;
    if (b.type === 'win' && rank === 1) winAmt = Math.round(b.amount * b.winOdds);
    if (b.type === 'place' && rank <= 3) winAmt = Math.round(b.amount * b.placeOdds);
    if (winAmt > 0) {
      state.money += winAmt;
      addLog('🎲 下注命中！' + (b.type === 'win' ? '獨贏' : '位置') + ' ' + fmt(b.amount) + ' 金 × ' + (b.type === 'win' ? b.winOdds : b.placeOdds) + ' = +' + fmt(winAmt));
    } else {
      addLog('🎲 下注沒中，-' + fmt(b.amount) + ' 金');
    }
    state.pendingBet = null;
  }
  addLog('🏆 ' + h.name + '出戰' + race.name + '，第 ' + rank + ' 名' + (prize > 0 ? '，獎金 +' + fmt(prize) : '，無獎金') + '。');
  const live = $('race-live');
  const winner = outcome.runners[0];
  const me = outcome.runners.find(r => r.isPlayer);
  const gap = me ? Math.max(0, Math.round(winner.eff - me.eff)) : 0;
  const ceremony = rank === 1
    ? '<div class="py-2 text-2xl">🎉 🏆 🎊</div><div class="text-sm font-black text-[#d9941a]">領獎台！' + esc(h.name) + ' 站上冠軍寶座</div>'
    : '';
  const tip = rank === 1 ? '' : '<div class="text-xs text-[#5c5346] mt-2">💡 差一點的原因：' + lossTip(h, race, gap) + '</div>';
  live.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・結果</h2>'
    + '<div class="text-center py-3"><div class="text-3xl font-black ' + (rank === 1 ? 'text-[#d9941a]' : '') + '">第 ' + rank + ' 名</div>'
    + ceremony
    + '<div class="text-sm font-bold mt-1">' + (rank === 1 ? '🎉 冠軍！' : (rank <= 3 ? '👏 進入前三名！' : '下次再接再厲')) + '</div>'
    + (prize > 0 ? '<div class="text-lg font-black text-[#1d6b41] mt-1">獎金 +' + fmt(prize) + ' 金</div>' : '<div class="text-sm text-[#5c5346] mt-1">這場沒有獎金</div>')
    + tip
    + '</div>'
    + '<div class="text-xs text-[#5c5346] space-y-1 border-t pt-2">' + outcome.runners.map(r => '<div>第' + r.rank + '名　' + esc(r.name) + (r.isPlayer ? '（你）' : '') + '</div>').join('') + '</div>';
  showToast(rank === 1 ? '冠軍！獎金 +' + fmt(prize) : '第 ' + rank + ' 名' + (prize > 0 ? '，獎金 +' + fmt(prize) : ''));
  sfx(rank === 1 ? 'win' : 'lose');
  if (prize > 0) sfx('coin');
  afterAction();
}

/* ================= 商店 / 馬房操作 ================= */
function buyHorse(shopIdx) {
  const h = state.shop[shopIdx];
  if (!h) return;
  if (state.horses.filter(x => !x.retired).length >= MAX_STABLE && state.horses.length >= MAX_STABLE) { showToast('馬房滿了（最多 ' + MAX_STABLE + ' 匹），先賣掉或引退一匹'); return; }
  if (state.horses.length >= MAX_STABLE) { showToast('馬房滿了（最多 ' + MAX_STABLE + ' 匹）'); return; }
  if (state.money < h.price) { showToast('金不夠，這匹要 ' + fmt(h.price) + ' 金'); return; }
  state.money -= h.price;
  const bought = Object.assign({}, h);
  delete bought.price;
  state.horses.push(bought);
  state.activeHorseId = bought.id;
  state.shop.splice(shopIdx, 1);
  addLog('🛒 買下「' + bought.name + '」（' + RARITY[bought.rarity].label + '），-' + fmt(h.price) + ' 金');
  showToast('買下「' + bought.name + '」！');
  sfx('coin');
  saveState();
  renderAll();
}
function refreshShop() {
  if (state.shopFreeRefresh) {
    state.shopFreeRefresh = false;
    state.shop = [genShopHorse(), genShopHorse(), genShopHorse()];
    addLog('🛒 市場換了一批馬');
  } else {
    if (state.money < 2000) { showToast('金不夠，換一批要 2,000 金'); return; }

function sellHorse(horseId) {
  const idx = state.horses.findIndex(h => h.id === horseId);
  if (idx < 0) return;
  const h = state.horses[idx];
  const value = Math.round(horsePrice(h) * 0.5) + h.wins * 5000;

  showToast('賣掉「' + h.name + '」，+' + fmt(value));

/* ================= 配種 ================= */
function breed(sireId, damId) {
  const sire = state.horses.find(h => h.id === sireId);
  const dam = state.horses.find(h => h.id === damId);
  if (!sire || !dam) { showToast('請選一匹公馬和一匹母馬'); return; }
  if (sire.sex !== '公' || dam.sex !== '母') { showToast('配種需要一匹公馬＋一匹母馬'); return; }
  if (sire.retired || dam.retired) { showToast('引退馬不能配種'); return; }
  if (sireId === damId) { showToast('不能自己跟自己配'); return; }
  if (state.money < BREED_COST) { showToast('配種費要 ' + fmt(BREED_COST) + ' 金'); return; }
  if (state.horses.length >= MAX_STABLE) { showToast('馬房滿了（最多 ' + MAX_STABLE + ' 匹）'); return; }
  state.money -= BREED_COST;
  const foal = newHorse();
  foal.age = 2;
  STAT_KEYS.forEach(k => { foal.stats[k] = clamp(Math.round((sire.stats[k] + dam.stats[k]) / 2) + randInt(-3, 5), 10, 99); });
  let mutated = '';
  if (Math.random() < 0.15) {
    const k = randPick(STAT_KEYS);
    foal.stats[k] = clamp(foal.stats[k] + 5, 10, 99);
    mutated = '（突變！' + STAT_LABEL[k] + ' +5）';
  }
  const order = ['common', 'good', 'noble', 'legend'];
  let rIdx = Math.max(order.indexOf(sire.rarity), order.indexOf(dam.rarity));
  if (Math.random() < 0.2 && rIdx < 3) rIdx += 1;
  foal.rarity = order[rIdx];
  foal.turf = Math.random() < 0.5 ? sire.turf : dam.turf;
  foal.dist = Math.random() < 0.5 ? sire.dist : dam.dist;
  state.horses.push(foal);
  state.activeHorseId = foal.id;
  addLog('🐴 ' + sire.name + ' × ' + dam.name + ' 產駒「' + foal.name + '」（' + RARITY[foal.rarity].label + '）' + mutated + '，配種費 -' + fmt(BREED_COST));
  showToast('產駒「' + foal.name + '」！' + mutated);
  sfx('foal');
  saveState();
  renderAll();
}

/* ================= 下注 ================= */
function previewOdds(race) {
  const h = activeHorse();
  if (!h) return null;
  const myPow = calcPower(h, race);
  const spread = [-8, -5, -2, 0, 2, 5, 8];
  let sum = myPow;
  for (let i = 0; i < 7; i++) sum += race.oppBase + spread[i];
  const winProb = myPow / sum;
  const winOdds = clamp(Math.round((1 / winProb) * 10) / 10, 1.2, 12);
  const placeOdds = Math.max(1.1, Math.round(winOdds * 0.35 * 10) / 10);
  return { win: winOdds, place: placeOdds };
}
function setBet(raceId, type, amount) {
  const race = RACES.find(r => r.id === raceId);
  const h = activeHorse();
  if (!race || !h) return;
  const err = raceEligible(h, race);
  if (err) { showToast(err); return; }
  if (state.money < amount) { showToast('金不夠，下注要 ' + fmt(amount) + ' 金'); return; }
  if (state.pendingBet) { state.money += state.pendingBet.amount; }
  const odds = previewOdds(race);
  state.money -= amount;
  state.pendingBet = { raceId: raceId, type: type, amount: amount, winOdds: odds.win, placeOdds: odds.place };
  addLog('🎲 下注' + race.name + '「' + (type === 'win' ? '獨贏' : '位置') + '」' + fmt(amount) + ' 金（賠率 ' + (type === 'win' ? odds.win : odds.place) + '）');
  showToast('已下注，開賽見真章');
  sfx('coin');
  saveState();
  renderAll();
}
function cancelBet() {
  if (!state.pendingBet) return;
  state.money += state.pendingBet.amount;
  addLog('🎲 取消下注，退回 ' + fmt(state.pendingBet.amount) + ' 金');
  state.pendingBet = null;
  saveState();
  renderAll();
}

/* ================= 觀賽下注（不參賽，押 NPC 賽事） ================= */
let specField = null;
function genSpectateField(race) {
  const pool = OPP_NAMES.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  const runners = [];
  let sum = 0;
  for (let i = 0; i < 8; i++) {
    const power = race.oppBase + randInt(-8, 8);
    runners.push({ name: pool[i], power: power, isPlayer: false });
    sum += power;
  }
  runners.forEach(r => {
    r.winOdds = clamp(Math.round((sum / r.power) * 10) / 10, 1.2, 12);
    r.placeOdds = Math.max(1.1, Math.round(r.winOdds * 0.35 * 10) / 10);
  });
  return { raceId: race.id, runners: runners };
}
function placeSpectateBet() {
  if (racing) return;
  const raceId = $('spec-race').value;
  const race = RACES.find(r => r.id === raceId);
  if (!race || !specField || specField.raceId !== raceId) { showToast('請先選一場賽事'); return; }
  const pickIdx = Number($('spec-horse').value);
  const type = $('spec-type').value;
  const amount = Number($('spec-amount').value);
  const pick = specField.runners[pickIdx];
  if (!pick) return;
  if (state.money < amount) { showToast('金不夠，下注要 ' + fmt(amount) + ' 金'); return; }
  state.money -= amount;
  sfx('coin');
  addLog('👀 觀賽下注' + race.name + '「' + pick.name + '・' + (type === 'win' ? '獨贏' : '位置') + '」' + fmt(amount) + ' 金（賠率 ' + (type === 'win' ? pick.winOdds : pick.placeOdds) + '）');
  runSpectateRace(race, pickIdx, type, amount);
}
function runSpectateRace(race, pickIdx, type, amount) {
  racing = true;
  sfx('whistle');
  const runners = specField.runners.map(r => ({ name: r.name, power: r.power, isPlayer: false }));
  runners.forEach(r => { r.eff = r.power * (0.92 + Math.random() * 0.16); });
  runners.sort((a, b) => b.eff - a.eff);
  runners.forEach((r, i) => { r.rank = i + 1; });
  const outcome = { runners: runners, myRank: runners.find(r => r.name === specField.runners[pickIdx].name).rank };
  startRaceAnimation(race, outcome, () => { finishSpectateRace(race, outcome, pickIdx, type, amount); racing = false; });
}
function finishSpectateRace(race, outcome, pickIdx, type, amount) {
  const pickName = specField.runners[pickIdx].name;
  const pick = outcome.runners.find(r => r.name === pickName);
  const rank = pick ? pick.rank : 8;
  const odds = type === 'win' ? specField.runners[pickIdx].winOdds : specField.runners[pickIdx].placeOdds;
  let winAmt = 0;
  if (type === 'win' && rank === 1) winAmt = Math.round(amount * odds);
  if (type === 'place' && rank <= 3) winAmt = Math.round(amount * odds);
  if (winAmt > 0) {
    state.money += winAmt;
    addLog('👀 觀賽下注命中！「' + pickName + '」第 ' + rank + ' 名，' + fmt(amount) + ' 金 × ' + odds + ' = +' + fmt(winAmt));
    showToast('下注中了！+' + fmt(winAmt));
    sfx('win');
    sfx('coin');
  } else {
    addLog('👀 觀賽下注沒中，「' + pickName + '」第 ' + rank + ' 名，-' + fmt(amount) + ' 金');
    showToast('沒中，下次再來');
    sfx('lose');
  }
  specField = null;
  const live = $('race-live');
  live.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・觀賽結果</h2>'
    + '<div class="text-center py-3"><div class="text-3xl font-black ' + (winAmt > 0 ? 'text-[#d9941a]' : '') + '">你押的「' + esc(pickName) + '」第 ' + rank + ' 名</div>'
    + (winAmt > 0 ? '<div class="text-lg font-black text-[#1d6b41] mt-1">派彩 +' + fmt(winAmt) + ' 金</div>' : '<div class="text-sm text-[#5c5346] mt-1">這注沒中</div>')
    + '</div>'
    + '<div class="text-xs text-[#5c5346] space-y-1 border-t pt-2">' + outcome.runners.map(r => '<div>第' + r.rank + '名　' + esc(r.name) + (r.name === pickName ? '（你押的）' : '') + '</div>').join('') + '</div>';
  advanceWeek();
  saveState();
  renderAll();
}

      + (eq ? '<button type="button" data-unequip="' + slot + '" class="paper-btn text-xs px-2 py-1 mt-1.5">卸下</button>' : '')
      + (inv.length ? '<div class="flex flex-wrap gap-1.5 mt-2">' + inv.map(it =>
        '<button type="button" data-equip="' + it.id + '" class="paper-btn text-xs px-2 py-1">' + esc(it.name) + '（' + equipBonusText(it) + '）</button>').join('') + '</div>'
        : '<div class="text-[11px] text-[#9a8f7a] mt-1">背包沒有' + EQUIP_SLOTS[slot].label + '，贏比賽或去裝備市場看看</div>')
      + '</div>';
  }).join('');
  panel.innerHTML = '<h2 class="font-black text-base">🎒 裝備 <span class="text-xs font-bold text-[#5c5346]">裝上後比賽戰力直接提升</span></h2><div class="mt-2">' + slots + '</div>';
  document.querySelectorAll('[data-equip]').forEach(btn => {
    btn.addEventListener('click', () => equipItem(h.id, btn.getAttribute('data-equip')));
  });
  document.querySelectorAll('[data-unequip]').forEach(btn => {
    btn.addEventListener('click', () => unequipItem(h.id, btn.getAttribute('data-unequip')));
  });
}
function renderBreedPanel() {
  const panel = $('breed-panel');
  const males = state.horses.filter(h => h.sex === '公' && !h.retired);
  const females = state.horses.filter(h => h.sex === '母' && !h.retired);
  const canBreed = males.length && females.length && state.horses.length < MAX_STABLE;
  panel.innerHTML = '<h2 class="font-black text-base">🐴 繁殖配種 <span class="text-xs font-bold text-[#5c5346]">配種費 ' + fmt(BREED_COST) + ' 金</span></h2>'
    + '<p class="text-xs text-[#5c5346] mt-1">子嗣五圍取父母平均 ± 浮動，15% 機率突變 +5，稀有度取較高者、20% 機率升一階。出生即 2 歲，可直接育成。</p>'
    + '<div class="grid grid-cols-2 gap-2 mt-2">'
    + '<select id="breed-sire" class="card p-2 text-sm font-bold w-full">' + males.map(m => '<option value="' + m.id + '">' + esc(m.name) + '（' + RARITY[m.rarity].label + '）</option>').join('') + '</select>'
    + '<select id="breed-dam" class="card p-2 text-sm font-bold w-full">' + females.map(m => '<option value="' + m.id + '">' + esc(m.name) + '（' + RARITY[m.rarity].label + '）</option>').join('') + '</select>'
    + '</div>'
    + '<button type="button" id="btn-breed" class="gold-btn text-sm px-4 py-2.5 mt-2 w-full"' + (canBreed ? '' : ' disabled style="opacity:.45"') + '>'
    + (canBreed ? '開始配種（' + fmt(BREED_COST) + ' 金）' : (state.horses.length >= MAX_STABLE ? '馬房滿了' : '需要一匹公馬＋一匹母馬')) + '</button>';
  const btn = $('btn-breed');
  if (btn) btn.addEventListener('click', () => breed($('breed-sire').value, $('breed-dam').value));
}
function renderTrain() {
  const h = activeHorse();
  const sum = $('train-horse-summary');
  if (!h) { sum.innerHTML = '<p class="text-sm text-[#5c5346]">馬房是空的。</p>'; $('train-actions').innerHTML = ''; return; }
  sum.innerHTML = '<div class="flex items-center justify-between"><span class="font-black">' + esc(h.name) + '</span>' + rarityTag(h.rarity) + '</div>'
    + '<div class="text-xs text-[#5c5346] mt-1">體力 <b>' + h.energy + '/100</b>・心情 <b class="mood-' + h.mood + '">' + MOOD_LABEL[h.mood] + '</b>・' + h.age + '歲・戰績 ' + h.wins + '勝/' + h.races + '戰</div>'
    + '<div class="stat-bar mt-2"><div class="stat-fill" style="width:' + h.energy + '%;background:' + (h.energy < 25 ? '#9e2a22' : '#1d6b41') + '"></div></div>';
  const acts = [
    { label: '速度訓練', sub: '體力 -22', fn: () => doTrain('spd'), cls: 'gold-btn' },
    { label: '耐力訓練', sub: '體力 -22', fn: () => doTrain('sta'), cls: 'gold-btn' },
    { label: '力量訓練', sub: '體力 -22', fn: () => doTrain('pow'), cls: 'gold-btn' },
    { label: '根性訓練', sub: '體力 -22', fn: () => doTrain('gut'), cls: 'gold-btn' },
    { label: '智慧訓練', sub: '體力 -22', fn: () => doTrain('wis'), cls: 'gold-btn' },
    { label: '休息', sub: '體力 +35（上限 100）', fn: doRest, cls: 'green-btn' },
    { label: '散步', sub: '心情 +1・體力 +12', fn: doWalk, cls: 'green-btn' },
    { label: '特級飼料', sub: '800 金・體力 +25', fn: doFeed, cls: 'ink-btn' },
  ];
  $('train-actions').innerHTML = acts.map((a, i) =>
    '<button type="button" data-act="' + i + '" class="' + a.cls + ' px-2 py-3 text-sm">' + a.label + '<div class="text-[11px] font-bold opacity-80">' + a.sub + '</div></button>').join('');
  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => { acts[Number(btn.getAttribute('data-act'))].fn(); });
  });
  $('train-log').innerHTML = state.logs.slice(0, 8).map(l => '<div><span class="text-[#9a8f7a]">' + esc(l.week) + '</span>　' + esc(l.text) + '</div>').join('');
}
function renderJockeyPanel() {
  const panel = $('jockey-panel');
  const j = activeJockey();
  panel.innerHTML = '<h2 class="font-black text-base">🧢 騎師 <span class="text-xs font-bold text-[#5c5346]">出賽加成直接算進戰力，勝場升等</span></h2>'
    + '<div class="space-y-2 mt-2">' + state.jockeys.map(jj => {
      const b = jockeyBonus(jj);
      const active = jj.id === (j && j.id);
      return '<button type="button" data-jockey="' + jj.id + '" class="w-full text-left p-2.5 rounded-xl border-2 ' + (active ? 'border-[#d9941a] bg-[#fff8e6]' : 'border-[#e6dcc5] bg-white') + '">'
        + '<div class="flex items-center justify-between"><span class="font-black text-sm">' + (active ? '⭐ ' : '') + esc(jj.name) + '・Lv' + jj.level + '</span><span class="text-xs font-black" style="color:' + (jj.grade === 'ace' ? '#d9941a' : jj.grade === 'elite' ? '#1d4ed8' : jj.grade === 'normal' ? '#1d6b41' : '#5c5346') + '">' + JOCKEY_GRADES[jj.grade].label + '</span></div>'
        + '<div class="text-xs text-[#5c5346] mt-0.5">速度 +' + b.spd + '・智慧 +' + b.wis + '・根性 +' + b.gut + '・經驗 ' + jj.exp + '/100・出賽費 ' + fmt(JOCKEY_GRADES[jj.grade].raceFee) + ' 金</div>'
        + '<div class="mt-1.5"><div class="flex justify-between text-[11px] font-bold"><span>💛 羈絆 ' + (jj.bond || 0) + '/100</span>' + ((jj.bond || 0) >= 80 ? '<span class="text-[#d9941a]">🔥 彩圈！加成翻倍</span>' : '<span class="text-[#9a8f7a]">滿 80 進彩圈，加成翻倍</span>') + '</div><div class="h-2 rounded-full bg-[#e6dcc5] mt-0.5 overflow-hidden"><div class="h-full rounded-full ' + ((jj.bond || 0) >= 80 ? 'bg-[#f6c453]' : 'bg-[#e88ca0]') + '" style="width:' + (jj.bond || 0) + '%"></div></div></div></button>';
    }).join('') + '</div>'
    + '<div class="mt-2 space-y-2">' + state.shopJockeys.map((jj, i) => {
      return '<div class="p-2.5 rounded-xl border border-[#e6dcc5] bg-white flex items-center justify-between"><div><span class="font-black text-sm">' + esc(jj.name) + '</span><span class="text-xs text-[#5c5346]">　' + JOCKEY_GRADES[jj.grade].label + '・速度 +' + JOCKEY_GRADES[jj.grade].spd + '</span></div>'
        + '<button type="button" data-hire="' + i + '" class="green-btn text-xs px-3 py-1.5">聘用 ' + fmt(JOCKEY_GRADES[jj.grade].fee) + '</button></div>';
    }).join('') + '</div>';
  document.querySelectorAll('[data-jockey]').forEach(btn => {
    btn.addEventListener('click', () => { state.activeJockeyId = btn.getAttribute('data-jockey'); saveState(); renderAll(); });
  });
  document.querySelectorAll('[data-hire]').forEach(btn => {
    btn.addEventListener('click', () => hireJockey(Number(btn.getAttribute('data-hire'))));
  });
}
function renderBetPanel() {
  const panel = $('bet-panel');
  const h = activeHorse();
  const eligible = RACES.filter(r => !raceEligible(h, r));
  const selRaceId = (state.pendingBet && state.pendingBet.raceId) || (eligible[0] && eligible[0].id) || '';
  const selRace = RACES.find(r => r.id === selRaceId);
  const odds = selRace ? previewOdds(selRace) : null;
  let html = '<h2 class="font-black text-base">🎲 下注 <span class="text-xs font-bold text-[#5c5346]">押自己馬的比賽，賠率看實力對比</span></h2>';
  if (state.pendingBet) {
    const b = state.pendingBet;
    const br = RACES.find(r => r.id === b.raceId);
    html += '<div class="p-2.5 rounded-xl bg-[#fff8e6] border border-[#d9941a] mt-2 text-sm">已下注：<b>' + esc(br ? br.name : '') + '「' + (b.type === 'win' ? '獨贏' : '位置') + '」' + fmt(b.amount) + ' 金</b>，賠率 ' + (b.type === 'win' ? b.winOdds : b.placeOdds) + '（' + (b.type === 'win' ? '要拿冠軍' : '前三名就中') + '）'
      + '<button type="button" id="btn-cancel-bet" class="paper-btn text-xs px-2 py-1 ml-2">取消退回</button></div>';
  }
  if (!eligible.length) {
    html += '<p class="text-xs text-[#5c5346] mt-2">目前沒有可報名的比賽，先去育成。</p>';
  } else {
    html += '<div class="grid grid-cols-3 gap-2 mt-2">'
      + '<select id="bet-race" class="card p-2 text-sm font-bold w-full">' + eligible.map(r => '<option value="' + r.id + '"' + (r.id === selRaceId ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') + '</select>'
      + '<select id="bet-type" class="card p-2 text-sm font-bold w-full"><option value="win">獨贏（冠軍）</option><option value="place">位置（前三）</option></select>'
      + '<select id="bet-amount" class="card p-2 text-sm font-bold w-full">' + BET_AMOUNTS.map(a => '<option value="' + a + '">' + fmt(a) + ' 金</option>').join('') + '</select>'
      + '</div>'
      + (odds ? '<p class="text-xs text-[#5c5346] mt-2">目前賠率：獨贏 <b>' + odds.win + '</b>・位置 <b>' + odds.place + '</b>（依主力馬與對手實力估算，每次看略有浮動）</p>' : '')
      + '<button type="button" id="btn-bet" class="gold-btn text-sm px-4 py-2.5 mt-2 w-full">下注</button>';
  }
  if (!specField) specField = genSpectateField(RACES[0]);
  html += '<h2 class="font-black text-base mt-4">👀 觀賽下注 <span class="text-xs font-bold text-[#5c5346]">不參賽也能押，佔用當週行動</span></h2>'
    + '<div class="grid grid-cols-2 gap-2 mt-2">'
    + '<select id="spec-race" class="card p-2 text-sm font-bold w-full">' + RACES.map(r => '<option value="' + r.id + '"' + (r.id === specField.raceId ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') + '</select>'
    + '<select id="spec-horse" class="card p-2 text-sm font-bold w-full">' + specField.runners.map((r, i) => '<option value="' + i + '">[' + r.winOdds + '] ' + esc(r.name) + '</option>').join('') + '</select>'
    + '</div>'
    + '<div class="grid grid-cols-2 gap-2 mt-2">'
    + '<select id="spec-type" class="card p-2 text-sm font-bold w-full"><option value="win">獨贏（冠軍）</option><option value="place">位置（前三）</option></select>'
    + '<select id="spec-amount" class="card p-2 text-sm font-bold w-full">' + BET_AMOUNTS.map(a => '<option value="' + a + '">' + fmt(a) + ' 金</option>').join('') + '</select>'
    + '</div>'
    + '<p class="text-xs text-[#5c5346] mt-2">賠率寫在馬名前面；獨贏要押的馬拿冠軍，位置前三名就中。下注觀賽會用掉當週行動。</p>'
    + '<button type="button" id="btn-spec-bet" class="gold-btn text-sm px-4 py-2.5 mt-2 w-full">下注並觀賽</button>';
  panel.innerHTML = html;
  const sb = $('btn-spec-bet');
  if (sb) sb.addEventListener('click', placeSpectateBet);
  const sr = $('spec-race');
  if (sr) sr.addEventListener('change', () => { specField = genSpectateField(RACES.find(r => r.id === sr.value)); renderBetPanel(); });
  const bb = $('btn-bet');
  if (bb) bb.addEventListener('click', () => setBet($('bet-race').value, $('bet-type').value, Number($('bet-amount').value)));
  const cb = $('btn-cancel-bet');
  if (cb) cb.addEventListener('click', cancelBet);
  const br = $('bet-race');
  if (br) br.addEventListener('change', renderBetPanel);
}
function renderRace() {
  renderJockeyPanel();
  renderBetPanel();
  const h = activeHorse();
  $('race-list').innerHTML = RACES.map(race => {
    const err = raceEligible(h, race);
    return '<div class="p-3 rounded-xl border border-[#e6dcc5] bg-white">'
      + '<div class="flex items-center justify-between"><span class="font-black text-sm">' + esc(race.name) + '</span><span class="text-xs font-black text-[#d9941a]">獎金 ' + fmt(race.prize) + '</span></div>'
      + '<div class="text-xs text-[#5c5346] mt-1">' + race.dist + 'm・' + race.turf + '地・' + race.distType + '距離・需 ' + race.minAge + ' 歲・' + race.minWins + ' 勝以上</div>'
      + '<button type="button" data-race="' + race.id + '" class="gold-btn text-sm px-4 py-2 mt-2 w-full"' + (err ? ' disabled style="opacity:.45"' : '') + '>'
      + (err ? esc(err) : '報名出賽（體力 -25）') + '</button></div>';
  }).join('');
  document.querySelectorAll('[data-race]').forEach(btn => {
    btn.addEventListener('click', () => runRace(btn.getAttribute('data-race')));
  });
  $('race-records').innerHTML = state.logs.filter(l => l.text.indexOf('出戰') === 0 || l.text.indexOf('🏆') === 0).slice(0, 8)
    .map(l => '<div><span class="text-[#9a8f7a]">' + esc(l.week) + '</span>　' + esc(l.text) + '</div>').join('')
    || '<div>還沒有出賽紀錄，先去育成練一週再來報名新馬戰。</div>';
}
function renderShop() {
  $('btn-refresh-shop').textContent = state.shopFreeRefresh ? '換一批（本週免費）' : '換一批（2,000 金）';
  $('shop-list').innerHTML = state.shop.map((h, i) => {
    return '<div class="p-3 rounded-xl border border-[#e6dcc5] bg-white">'
      + '<div class="flex items-center justify-between"><span class="font-black text-sm">' + esc(h.name) + '</span>' + rarityTag(h.rarity) + '</div>'
      + '<div class="text-xs text-[#5c5346] mt-1">' + h.age + '歲 ' + h.sex + '馬・' + h.turf + '地・' + h.dist + '距離</div>'
      + '<div class="grid grid-cols-5 gap-1 mt-2 text-center text-[11px]">'
      + STAT_KEYS.map(k => '<div class="bg-[#f4ede0] rounded-lg py-1"><div class="font-bold">' + STAT_LABEL[k] + '</div><div class="font-black">' + h.stats[k] + '</div></div>').join('')
      + '</div>'
      + '<button type="button" data-buy="' + i + '" class="green-btn text-sm px-4 py-2 mt-2 w-full">買下・' + fmt(h.price) + ' 金</button></div>';
  }).join('') || '<p class="text-sm text-[#5c5346]">市場本週沒有馬了。</p>';
  document.querySelectorAll('[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => buyHorse(Number(btn.getAttribute('data-buy'))));
  });
  const eq = $('equip-shop');
  eq.innerHTML = '<h2 class="font-black text-base">🎒 裝備市場 <span class="text-xs font-bold text-[#5c5346]">每週換兩件</span></h2>'
    + '<div class="space-y-2 mt-2">' + state.shopEquip.map((it, i) => {
      return '<div class="p-2.5 rounded-xl border border-[#e6dcc5] bg-white flex items-center justify-between"><div><span class="font-black text-sm" style="color:' + EQUIP_TIERS[it.tier].color + '">' + esc(it.name) + '</span><span class="text-xs text-[#5c5346]">　' + equipBonusText(it) + '</span></div>'
        + '<button type="button" data-buy-equip="' + i + '" class="green-btn text-xs px-3 py-1.5">' + fmt(it.price) + ' 金</button></div>';
    }).join('') + '</div>';
  document.querySelectorAll('[data-buy-equip]').forEach(btn => {
    btn.addEventListener('click', () => buyEquipment(Number(btn.getAttribute('data-buy-equip'))));
  });
}
function renderHall() {
  $('hall-list').innerHTML = state.hall.length
    ? state.hall.map(h => '<div class="p-3 rounded-xl border border-[#e6dcc5] bg-white"><span class="font-black text-sm">👑 ' + esc(h.name) + '</span><div class="text-xs text-[#5c5346] mt-1">G1 冠軍 ' + h.g1wins + ' 次・生涯 ' + h.wins + ' 勝・累積獎金 ' + fmt(h.earnings) + '</div></div>').join('')
    : '<p class="text-sm text-[#5c5346]">還沒有馬進名人堂。贏下一場 G1，名字就會刻在這裡。</p>';
  $('farm-stats').innerHTML =
    '<div>出賽 <b>' + state.totalRaces + '</b> 場・勝利 <b>' + state.totalWins + '</b> 場・累積獎金 <b>' + fmt(state.totalEarnings) + '</b></div>'
    + '<div>現役馬 <b>' + state.horses.filter(h => !h.retired).length + '</b> 匹・引退馬 <b>' + state.horses.filter(h => h.retired).length + '</b> 匹</div>'
    + '<div>存檔在本機瀏覽器（天駒養成錄 v1）。</div>'
    + '<button type="button" id="btn-reset" class="paper-btn text-xs px-3 py-2 mt-2">重新開始</button>';
  $('btn-reset').addEventListener('click', resetGame);
}
function renderAll() {
  renderHeader();
  renderStable();
  renderTrain();
  renderRace();
  renderShop();
  renderHall();
}
function switchView(view) {
  sfx('tap');
  currentView = view;
  ['stable', 'train', 'race', 'shop', 'hall'].forEach(v => {
    $('view-' + v).classList.toggle('hidden', v !== view);
  });
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-view') === view);
  });
  window.scrollTo({ top: 0 });
}
function init() {
  const saved = loadState();
  state = saved || createDefaultState();
  migrateState();
  if (!saved) saveState();
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.getAttribute('data-view')));
  });
  $('btn-refresh-shop').addEventListener('click', refreshShop);
  setMuted(isMuted());
  $('btn-mute').addEventListener('click', () => { setMuted(!isMuted()); if (!isMuted()) sfx('tap'); });
  renderAll();
}
window.addEventListener('load', init);
</script>
</body>
</html>
