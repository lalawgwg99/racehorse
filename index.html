<!DOCTYPE html>

<style>

  .gold-btn:active { transform: translateY(1px); box-shadow: none; }

  .ink-btn { background: #1e1a16; color: #fdfbf3; font-weight: 800; border-radius: .75rem; }
  .paper-btn { background: #f4ede0; color: #5c5346; font-weight: 700; border: 1px solid #d8cbb3; border-radius: .75rem; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .7rem 0 calc(.8rem + env(safe-area-inset-bottom)); min-height: 64px; font-size: 13px; font-weight: 800; color: #b8a686; text-align: center; }
  .nav-btn.active { color: #f6c453; }
  .nav-ico { font-size: 24px; line-height: 1; }
  .race-scene { position: relative; border-radius: 1rem; overflow: hidden; background-image: url('assets/race-track.webp'); background-size: cover; background-position: center 72%; border: 1px solid #d8cbb3; }
  .race-lane-row { position: relative; height: 2.6rem; border-bottom: 1px dashed rgba(255,255,255,.55); }
  .race-lane-row:last-child { border-bottom: none; }
  .race-token { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 2.3rem; height: 2.3rem; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); background: #fdfbf3; overflow: hidden; padding: 0; }
  .race-token.me { width: 2.6rem; height: 2.6rem; border-color: #d9941a; }
  .race-token img { width: 100%; height: 100%; object-fit: cover; }
  .race-token.bob { animation: bob .45s ease-in-out infinite alternate; }
  @keyframes bob { from { margin-top: 0; } to { margin-top: -3px; } }
  .race-flag { position: absolute; right: 2px; top: 0; bottom: 0; width: 3px; background: repeating-linear-gradient(180deg, #1e1a16 0 8px, #fff 8px 16px); z-index: 3; }
  .lane-name { position: absolute; left: 4px; top: 50%; transform: translateY(-50%); font-size: 10px; font-weight: 800; background: rgba(255,255,255,.88); border-radius: 999px; padding: 1px 6px; z-index: 2; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-pos { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); z-index: 2; }
  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .chip { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
</style>
</head>
<body class="turf-bg min-h-screen text-[#1e1a16]">
<div class="max-w-md mx-auto min-h-screen flex flex-col pb-20">

  <!-- 頂部資源列 -->

<script>
/* ================= 工具 ================= */
function $(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function round1(n) { return Math.round(n * 10) / 10; }

/* ================= 音效（WebAudio 合成，無外部檔案） ================= */
let audioCtx = null;
function isMuted() { try { return localStorage.getItem('tianju_muted') === '1'; } catch (e) { return false; } }
function setMuted(m) { try { localStorage.setItem('tianju_muted', m ? '1' : '0'); } catch (e) {} const b = $('btn-mute'); if (b) b.textContent = m ? '🔇' : '🔊'; }
function tone(freq, dur, type, vol, delay) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function sfx(kind) {
  if (isMuted()) return;
  if (kind === 'tap') tone(660, 0.07, 'square', 0.05);
  else if (kind === 'coin') { tone(950, 0.08, 'sine', 0.12); tone(1420, 0.16, 'sine', 0.12, 0.08); }
  else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.14, i * 0.11)); }
  else if (kind === 'lose') { tone(320, 0.2, 'sine', 0.1); tone(210, 0.3, 'sine', 0.1, 0.18); }
  else if (kind === 'whistle') { tone(2200, 0.12, 'sine', 0.07); tone(2200, 0.2, 'sine', 0.07, 0.16); }
  else if (kind === 'count') tone(880, 0.09, 'sine', 0.1);
  else if (kind === 'go') { tone(1047, 0.2, 'triangle', 0.14); tone(1568, 0.3, 'triangle', 0.12, 0.12); }
}

/* ================= 資料 ================= */
const SAVE_KEY = 'tianju_bet_v1';
const OLD_SAVE_KEY = 'tianju_save_v1';
const COATS = {
  bay: { label: '栗毛', img: 'assets/coat-bay.webp' },
  black: { label: '黑馬', img: 'assets/coat-black.webp' },
  white: { label: '白馬', img: 'assets/coat-white.webp' },
  chestnut: { label: '棗紅', img: 'assets/coat-chestnut.webp' },
  gray: { label: '灰馬', img: 'assets/coat-gray.webp' },
  palomino: { label: '金黃', img: 'assets/coat-palomino.webp' },
};
/* 24 匹固定參賽馬：五圍、場地、距離、毛色、騎師 */
const HORSES = [
  { id: 'h01', name: '金甲神駒', spd: 92, sta: 88, pow: 85, gut: 90, wis: 82, turf: '草', dist: '長', coat: 'palomino', jockey: '志豪' },
  { id: 'h02', name: '月光寶駒', spd: 90, sta: 86, pow: 84, gut: 88, wis: 85, turf: '草', dist: '中', coat: 'white', jockey: '阿哲' },
  { id: 'h03', name: '王者之風', spd: 89, sta: 90, pow: 86, gut: 84, wis: 80, turf: '泥', dist: '長', coat: 'black', jockey: '子軒' },
  { id: 'h04', name: '追風小子', spd: 86, sta: 82, pow: 80, gut: 84, wis: 78, turf: '草', dist: '短', coat: 'bay', jockey: '大樹' },
  { id: 'h05', name: '紫電飛馳', spd: 88, sta: 78, pow: 82, gut: 80, wis: 76, turf: '草', dist: '短', coat: 'white', jockey: '阿凱' },
  { id: 'h06', name: '白龍馬', spd: 84, sta: 84, pow: 78, gut: 82, wis: 80, turf: '草', dist: '中', coat: 'white', jockey: '文彬' },
  { id: 'h07', name: '風馳電掣', spd: 87, sta: 76, pow: 80, gut: 78, wis: 74, turf: '泥', dist: '短', coat: 'chestnut', jockey: '冠宇' },
  { id: 'h08', name: '銀河快駒', spd: 85, sta: 80, pow: 76, gut: 82, wis: 78, turf: '草', dist: '中', coat: 'gray', jockey: '建宏' },
  { id: 'h09', name: '雷霆戰駒', spd: 83, sta: 82, pow: 84, gut: 76, wis: 72, turf: '泥', dist: '中', coat: 'black', jockey: '阿明' },
  { id: 'h10', name: '夜鷹公主', spd: 80, sta: 76, pow: 72, gut: 78, wis: 74, turf: '泥', dist: '中', coat: 'black', jockey: '家豪' },
  { id: 'h11', name: '海浪飛馳', spd: 78, sta: 80, pow: 74, gut: 76, wis: 72, turf: '草', dist: '中', coat: 'gray', jockey: '柏翰' },
  { id: 'h12', name: '金駒疾風', spd: 82, sta: 74, pow: 76, gut: 72, wis: 70, turf: '泥', dist: '短', coat: 'gray', jockey: '志豪' },
  { id: 'h13', name: '玄風公主', spd: 76, sta: 78, pow: 70, gut: 76, wis: 74, turf: '泥', dist: '短', coat: 'bay', jockey: '阿哲' },
  { id: 'h14', name: '金駒雄心', spd: 79, sta: 77, pow: 73, gut: 75, wis: 71, turf: '泥', dist: '中', coat: 'palomino', jockey: '子軒' },
  { id: 'h15', name: '海浪小子', spd: 74, sta: 76, pow: 70, gut: 74, wis: 72, turf: '泥', dist: '短', coat: 'gray', jockey: '大樹' },
  { id: 'h16', name: '星月疾風', spd: 77, sta: 73, pow: 71, gut: 72, wis: 70, turf: '草', dist: '長', coat: 'bay', jockey: '阿凱' },
  { id: 'h17', name: '赤兔二世', spd: 81, sta: 70, pow: 74, gut: 70, wis: 68, turf: '草', dist: '短', coat: 'chestnut', jockey: '文彬' },
  { id: 'h18', name: '黑旋風', spd: 75, sta: 74, pow: 72, gut: 71, wis: 69, turf: '泥', dist: '長', coat: 'black', jockey: '冠宇' },
  { id: 'h19', name: '草原之風', spd: 72, sta: 76, pow: 68, gut: 73, wis: 71, turf: '草', dist: '長', coat: 'bay', jockey: '建宏' },
  { id: 'h20', name: '烈焰雄心', spd: 76, sta: 71, pow: 72, gut: 69, wis: 67, turf: '草', dist: '中', coat: 'chestnut', jockey: '阿明' },
  { id: 'h21', name: '青雲直上', spd: 71, sta: 73, pow: 67, gut: 70, wis: 68, turf: '草', dist: '中', coat: 'white', jockey: '家豪' },
  { id: 'h22', name: '疾風如燕', spd: 68, sta: 66, pow: 64, gut: 66, wis: 62, turf: '草', dist: '短', coat: 'gray', jockey: '柏翰' },
  { id: 'h23', name: '雪花公主', spd: 64, sta: 66, pow: 62, gut: 64, wis: 65, turf: '草', dist: '中', coat: 'white', jockey: '志豪' },
  { id: 'h24', name: '黃金傳奇', spd: 62, sta: 64, pow: 60, gut: 62, wis: 60, turf: '泥', dist: '長', coat: 'palomino', jockey: '阿哲' },
];
const HORSE_MAP = {};
HORSES.forEach(h => { HORSE_MAP[h.id] = h; });
const RACE_SCHEDULE = [
  { id: 'r1', name: '新馬戰', grade: '新馬', dist: 1200, turf: '草', distType: '短' },
  { id: 'r2', name: '條件戰', grade: '條件', dist: 1400, turf: '草', distType: '短' },
  { id: 'r3', name: '公開賽', grade: '公開', dist: 1600, turf: '草', distType: '中' },
  { id: 'r4', name: 'G3・春季盃', grade: 'G3', dist: 1800, turf: '泥', distType: '中' },
  { id: 'r5', name: 'G2・夏季盃', grade: 'G2', dist: 2000, turf: '草', distType: '中' },
  { id: 'r6', name: 'G1・天駒大賽', grade: 'G1', dist: 2400, turf: '草', distType: '長' },
];
const BET_TYPES = {
  win: { label: '獨贏', need: 1, hint: '選 1 匹拿冠軍' },
  place: { label: '位置', need: 1, hint: '選 1 匹進前三' },
  quinella: { label: '連贏', need: 2, hint: '選 2 匹，兩匹都進前二（順序不限）' },
  trifecta: { label: '三重彩', need: 3, hint: '選 3 匹，依序猜中前三名' },
};
const BET_AMOUNTS = [1000, 5000, 10000, 50000, 100000];
const WORK_PAY = 10000;
const RELIEF_PAY = 5000;

/* ================= 狀態 ================= */
let state = null;
let currentView = 'race';
let racing = false;
let raceAnim = null;
let toastTimer = null;
function createDefaultState(money) {
  return {
    money: money || 100000,
    day: 1,
    raceIdx: 0,
    races: [],
    horseForm: {},
    horseStats: {},
    stats: { bets: 0, hits: 0, wagered: 0, returned: 0, bestWin: 0, streak: 0, bestStreak: 0 },
    lastWorkDay: 0,
    lastReliefDay: 0,
    logs: [{ day: 1, text: '歡迎來到天駒賽馬！看馬、看賠率、下注、看比賽，贏了就領錢。' }],
  };
}
function saveState() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function loadState() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function migrateState() {
  if (!state.stats) state.stats = { bets: 0, hits: 0, wagered: 0, returned: 0, bestWin: 0, streak: 0, bestStreak: 0 };
  if (!state.horseForm) state.horseForm = {};
  if (!state.horseStats) state.horseStats = {};
  if (!state.races) state.races = [];
  if (state.lastWorkDay === undefined) state.lastWorkDay = 0;
  if (state.lastReliefDay === undefined) state.lastReliefDay = 0;
  if (!state.logs) state.logs = [];
}
function migratedMoney() {
  try {
    const raw = localStorage.getItem(OLD_SAVE_KEY);
    if (!raw) return 0;
    const old = JSON.parse(raw);
    return (old && typeof old.money === 'number') ? old.money : 0;
  } catch (e) { return 0; }
}
function showToast(text) {
  const el = $('toast-banner');
  if (!el) return;
  el.textContent = text;
  el.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}
function addLog(text) {
  state.logs.unshift({ day: state.day, text: text });
  if (state.logs.length > 40) state.logs.length = 40;
}

/* ================= 實力與賠率 ================= */
function formBonus(hid) {
  const f = state.horseForm[hid];
  if (!f || !f.length) return 0;
  const avg = f.reduce((a, b) => a + b, 0) / f.length;
  return clamp((4 - avg) * 1.5, -4.5, 4.5);
}
function horsePower(h, race) {
  const base = h.spd * 0.35 + h.sta * 0.25 + h.pow * 0.15 + h.gut * 0.15 + h.wis * 0.10;
  const turfFit = h.turf === race.turf ? 1.10 : 0.90;
  const distFit = h.dist === race.distType ? 1.10 : 0.90;
  return base * turfFit * distFit + formBonus(h.id);
}
function calcOdds(runners) {
  const total = runners.reduce((a, r) => a + r.power, 0);
  runners.forEach(r => {
    r.winOdds = round1(clamp(total / r.power * 0.85, 1.2, 30));
    r.placeOdds = round1(Math.max(1.1, r.winOdds * 0.4));
  });
}
function comboOdds(type, picks, race) {
  const byId = {};
  race.runners.forEach(r => { byId[r.hid] = r; });
  if (type === 'quinella' && picks.length === 2) {
    return round1(clamp(byId[picks[0]].winOdds * byId[picks[1]].winOdds / 8, 2, 60));
  }
  if (type === 'trifecta' && picks.length === 3) {
    return round1(clamp(byId[picks[0]].winOdds * byId[picks[1]].winOdds * byId[picks[2]].winOdds / 40, 10, 300));
  }
  return 0;
}
function payoutFor(bet, ranks) {
  const amt = bet.amount;
  if (bet.type === 'win') return ranks[0] === bet.picks[0] ? Math.round(amt * bet.odds) : 0;
  if (bet.type === 'place') return ranks.slice(0, 3).includes(bet.picks[0]) ? Math.round(amt * bet.odds) : 0;
  if (bet.type === 'quinella') { const top2 = ranks.slice(0, 2); return bet.picks.every(p => top2.includes(p)) ? Math.round(amt * bet.odds) : 0; }
  if (bet.type === 'trifecta') return ranks[0] === bet.picks[0] && ranks[1] === bet.picks[1] && ranks[2] === bet.picks[2] ? Math.round(amt * bet.odds) : 0;
  return 0;
}

/* ================= 賽程 ================= */
function genDayRaces() {
  state.races = RACE_SCHEDULE.map(rs => {
    const field = shuffle(HORSES).slice(0, 8).map(h => {
      const power = horsePower(h, rs);
      return { hid: h.id, power: power, winOdds: 0, placeOdds: 0 };
    });
    calcOdds(field);
    return { id: rs.id, name: rs.name, grade: rs.grade, dist: rs.dist, turf: rs.turf, distType: rs.distType, runners: field, done: false, ranks: [], bet: null };
  });
}
function currentRace() { return state.races[state.raceIdx] || null; }
function todayStats() {
  let wagered = 0, returned = 0, hits = 0, bets = 0;
  state.races.forEach(r => { if (r.bet) { bets += 1; wagered += r.bet.amount; returned += (r.bet.won || 0); if ((r.bet.won || 0) > 0) hits += 1; } });
  return { bets: bets, hits: hits, wagered: wagered, returned: returned, pnl: returned - wagered };
}

/* ================= 下注 ================= */
let betDraft = { type: 'win', picks: [], amount: 10000 };
function setBetType(t) { betDraft.type = t; betDraft.picks = []; sfx('tap'); renderBetSheet(); }
function setBetAmount(a) { betDraft.amount = a; sfx('tap'); renderBetSheet(); }
function togglePick(hid) {
  const need = BET_TYPES[betDraft.type].need;
  const i = betDraft.picks.indexOf(hid);
  if (i >= 0) { betDraft.picks.splice(i, 1); }
  else {
    if (betDraft.picks.length >= need) betDraft.picks.shift();
    betDraft.picks.push(hid);
  }
  sfx('tap');
  renderBetSheet();
}
function betOddsFor(race) {
  if (betDraft.type === 'win') return race.runners.find(r => r.hid === betDraft.picks[0]).winOdds;
  if (betDraft.type === 'place') return race.runners.find(r => r.hid === betDraft.picks[0]).placeOdds;
  return comboOdds(betDraft.type, betDraft.picks, race);
}
function placeBet() {
  const race = currentRace();
  if (!race || race.done || racing) return;
  const need = BET_TYPES[betDraft.type].need;
  if (betDraft.picks.length !== need) { showToast('請選 ' + need + ' 匹馬'); return; }
  if (state.money < betDraft.amount) { showToast('金不夠，下注要 ' + fmt(betDraft.amount) + ' 金'); return; }
  const odds = betOddsFor(race);
  state.money -= betDraft.amount;
  state.stats.bets += 1;
  state.stats.wagered += betDraft.amount;
  race.bet = { type: betDraft.type, picks: betDraft.picks.slice(), amount: betDraft.amount, odds: odds, won: 0 };
  sfx('coin');
  saveState();
  renderAll();
}
function doWork() {
  if (state.lastWorkDay === state.day) { showToast('今天已經打過工了，明天再來'); return; }
  state.lastWorkDay = state.day;
  state.money += WORK_PAY;
  addLog('💼 打工賺 +' + fmt(WORK_PAY) + ' 金');
  showToast('打工賺 +' + fmt(WORK_PAY) + ' 金！');
  sfx('coin');
  saveState();
  renderAll();
}
function checkRelief() {
  if (state.money < 1000 && state.lastReliefDay !== state.day) {
    state.lastReliefDay = state.day;
    state.money += RELIEF_PAY;
    addLog('🆘 破產救濟金 +' + fmt(RELIEF_PAY) + ' 金');
    showToast('金快用完，發救濟金 +' + fmt(RELIEF_PAY) + '！');
    saveState();
  }
}

/* ================= 比賽 ================= */
function raceCommentAt(prog, leaderName) {
  if (prog >= 0.75) return '最後直線！名次藏起來了，「' + leaderName + '」領先，但誰會贏還不知道！';
  if (prog >= 0.6) return '進入彎道，「' + leaderName + '」暫時領先！';
  if (prog >= 0.3) return '中段，各馬展開爭奪！';
  return '閘門開了！各馬衝出起跑線！';
}
function skipRace() {
  if (!raceAnim || raceAnim.done) return;
  raceAnim.done = true;
  raceAnim.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
  raceAnim.onFinish();
}
function startRaceAnimation(race, outcome, onFinish) {
  raceAnim = { done: false, timers: [], onFinish: onFinish };
  const live = $('race-live');
  live.classList.remove('hidden');
  const counts = ['3', '2', '1', '跑！'];
  let ci = 0;
  live.innerHTML = '<div class="text-center py-10"><div id="count-num" class="text-7xl font-black text-[#1d4d2e]">3</div><div class="text-sm text-[#5c5346] mt-2">預備…</div></div>'
    + '<div class="text-center"><button type="button" id="btn-skip-race" class="paper-btn text-xs px-3 py-1.5">⏩ 跳過比賽</button></div>';
  live.scrollIntoView({ behavior: 'smooth', block: 'center' });
  sfx('count');
  const wireSkip = () => { const b = $('btn-skip-race'); if (b) b.addEventListener('click', skipRace); };
  wireSkip();
  const cdTimer = setInterval(() => {
    ci++;
    if (ci >= counts.length) { clearInterval(cdTimer); sfx('go'); runScene(); return; }
    const el = $('count-num');
    if (el) el.textContent = counts[ci];
    sfx('count');
  }, 1000);
  raceAnim.timers.push(cdTimer);
  function runScene() {
    live.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・' + race.dist + 'm ' + race.turf + '地進行中…</h2>'
      + '<div class="text-center mt-2"><button type="button" id="btn-skip-race" class="paper-btn text-xs px-3 py-1.5">⏩ 跳過比賽</button></div>'
      + '<div class="race-scene mt-3"><div class="race-flag"></div>' + outcome.runners.map((r, i) =>
        '<div class="race-lane-row"><span class="lane-name">' + esc(r.name) + '</span>'
        + '<div class="race-token' + (r.isPicked ? ' me bob' : ' bob') + '" id="lane-' + i + '" style="left:6%">' + '<img src="' + COATS[r.coat].img + '" alt="">' + '</div>'
        + '<span class="lane-pos" id="lane-pos-' + i + '">-</span></div>').join('') + '</div>'
      + '<div id="race-comment" class="text-sm font-bold text-[#1d4d2e] mt-2">閘門開了！各馬衝出起跑線！</div>';
    wireSkip();
    const maxEff = Math.max.apply(null, outcome.runners.map(r => r.eff));
    const minEff = Math.min.apply(null, outcome.runners.map(r => r.eff));
    const durs = outcome.runners.map(r => Math.min(7000, 5200 * (maxEff / r.eff)));
    const maxDur = 5200 * (maxEff / minEff);
    const startAt = Date.now();
    outcome.runners.forEach((r, i) => {
      const tok = $('lane-' + i);
      if (tok) { tok.style.transition = 'left ' + durs[i] + 'ms linear'; void tok.offsetWidth; requestAnimationFrame(() => { requestAnimationFrame(() => { tok.style.left = '92%'; }); }); }
    });
    const posTimer = setInterval(() => {
      const elapsed = Date.now() - startAt;
      const prog = durs.map(d => clamp(elapsed / d, 0, 1));
      const overall = clamp(elapsed / Math.min(7000, maxDur), 0, 1);
      const leaderIdx = prog.map((p, j) => ({ j: j, p: p })).sort((a, b) => b.p - a.p)[0].j;
      const comment = $('race-comment');
      if (comment) comment.textContent = raceCommentAt(overall, outcome.runners[leaderIdx].name);
      outcome.runners.forEach((r, i) => {
        const pos = $('lane-pos-' + i);
        if (!pos) return;
        if (overall >= 0.75) { pos.textContent = '？'; return; }
        const cur = prog.map((p, j) => ({ j: j, p: p })).sort((a, b) => b.p - a.p).findIndex(x => x.j === i) + 1;
        pos.textContent = '第' + cur + '名';
      });
    }, 200);
    raceAnim.timers.push(posTimer);
    const to = setTimeout(() => {
      clearInterval(posTimer);
      if (raceAnim.done) return;
      raceAnim.done = true;
      onFinish();
    }, Math.min(7000, maxDur) + 700);
    raceAnim.timers.push(to);
  }
}
function runRace() {
  if (racing) return;
  const race = currentRace();
  if (!race || race.done) return;
  racing = true;
  sfx('whistle');
  const outcome = { runners: race.runners.map(r => {
    const h = HORSE_MAP[r.hid];
    return { hid: r.hid, name: h.name, coat: h.coat, eff: r.power * (0.92 + Math.random() * 0.16), isPicked: race.bet ? race.bet.picks.includes(r.hid) : false };
  }) };
  $('race-result').classList.add('hidden');
  startRaceAnimation(race, outcome, () => { racing = false; finishRace(race, outcome); });
}
function finishRace(race, outcome) {
  const sorted = outcome.runners.slice().sort((a, b) => b.eff - a.eff);
  const ranks = sorted.map(r => r.hid);
  race.done = true;
  race.ranks = ranks;
  ranks.forEach((hid, i) => {
    const f = (state.horseForm[hid] = state.horseForm[hid] || []);
    f.unshift(i + 1); if (f.length > 3) f.length = 3;
    const st = (state.horseStats[hid] = state.horseStats[hid] || { races: 0, wins: 0 });
    st.races += 1; if (i === 0) st.wins += 1;
  });
  let betHtml = '';
  if (race.bet) {
    const b = race.bet;
    const payout = payoutFor(b, ranks);
    b.won = payout;
    state.stats.returned += payout;
    if (payout > 0) {
      state.money += payout;
      state.stats.hits += 1;
      state.stats.streak += 1;
      state.stats.bestStreak = Math.max(state.stats.bestStreak, state.stats.streak);
      state.stats.bestWin = Math.max(state.stats.bestWin, payout - b.amount);
      betHtml = '<div class="text-lg font-black text-[#1d6b41] mt-1">🎉 中了！' + BET_TYPES[b.type].label + ' +' + fmt(payout) + ' 金（淨賺 +' + fmt(payout - b.amount) + '）</div>';
      sfx('win'); sfx('coin');
    } else {
      state.stats.streak = 0;
      betHtml = '<div class="text-sm font-bold text-[#9e2a22] mt-1">沒中，-' + fmt(b.amount) + ' 金</div>';
      sfx('lose');
    }
    addLog(race.name + '：' + BET_TYPES[b.type].label + ' ' + fmt(b.amount) + ' 金，' + (payout > 0 ? '中 +' + fmt(payout) : '沒中'));
  } else {
    addLog(race.name + '：沒下注，只看比賽（冠軍 ' + HORSE_MAP[ranks[0]].name + '）');
  }
  const isLast = state.raceIdx >= 5;
  const res = $('race-result');
  $('race-live').classList.add('hidden');
  res.classList.remove('hidden');
  res.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・結果</h2>'
    + '<div class="text-center py-3"><div class="text-3xl font-black">🥇 ' + esc(HORSE_MAP[ranks[0]].name) + '</div>'
    + betHtml
    + '</div>'
    + '<div class="text-xs text-[#5c5346] space-y-1 border-t pt-2">' + ranks.map((hid, i) => '<div>第' + (i + 1) + '名　' + esc(HORSE_MAP[hid].name) + (race.bet && race.bet.picks.includes(hid) ? '（你押的）' : '') + '</div>').join('') + '</div>'
    + '<button type="button" id="btn-next-race" class="gold-btn text-sm px-4 py-2.5 mt-3 w-full">' + (isLast ? '今日結算' : '下一場') + '</button>';
  $('btn-next-race').addEventListener('click', () => { if (isLast) showDaySummary(); else nextRace(); });
  res.scrollIntoView({ behavior: 'smooth', block: 'center' });
  saveState();
  renderAll();
  checkRelief();
}
function nextRace() {
  if (state.raceIdx < 5) {
    state.raceIdx += 1;
    betDraft = { type: 'win', picks: [], amount: 10000 };
    $('race-live').classList.add('hidden');
    $('race-result').classList.add('hidden');
    saveState();
    renderAll();
    window.scrollTo({ top: 0 });
  }
}
function showDaySummary() {
  const t = todayStats();
  const res = $('race-result');
  res.classList.remove('hidden');
  res.innerHTML = '<h2 class="font-black text-base">📅 第 ' + state.day + ' 天結算</h2>'
    + '<div class="grid grid-cols-3 gap-2 mt-3 text-center text-sm">'
    + '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">下注</div><div class="font-black">' + t.bets + ' 場</div></div>'
    + '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">命中</div><div class="font-black">' + t.hits + ' 場</div></div>'
    + '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">今日盈虧</div><div class="font-black ' + (t.pnl >= 0 ? 'text-[#1d6b41]' : 'text-[#9e2a22]') + '">' + (t.pnl >= 0 ? '+' : '') + fmt(t.pnl) + '</div></div>'
    + '</div>'
    + '<p class="text-xs text-[#5c5346] mt-2">明日賽程重新抽籤，馬匹近況會帶著走，連勝的馬賠率會變低。</p>'
    + '<button type="button" id="btn-next-day" class="gold-btn text-sm px-4 py-2.5 mt-3 w-full">進入第 ' + (state.day + 1) + ' 天</button>';
  $('btn-next-day').addEventListener('click', nextDay);
  res.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function nextDay() {
  state.day += 1;
  state.raceIdx = 0;
  betDraft = { type: 'win', picks: [], amount: 10000 };
  genDayRaces();
  $('race-live').classList.add('hidden');
  $('race-result').classList.add('hidden');
  saveState();
  renderAll();
  window.scrollTo({ top: 0 });
}

/* ================= 渲染 ================= */
function switchView(view) {
  currentView = view;
  $('view-race').classList.toggle('hidden', view !== 'race');
  $('view-records').classList.toggle('hidden', view !== 'records');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'records') renderRecords();
  sfx('tap');
}
function renderHeader() {
  $('header-day').textContent = '第 ' + state.day + ' 天・第 ' + (state.raceIdx + 1) + ' 場 / 6 場';
  $('header-money').textContent = '💰 ' + fmt(state.money);
  const t = todayStats();
  $('header-today').textContent = '今日 ' + t.hits + '勝/' + t.bets + '注・' + (t.pnl >= 0 ? '+' : '') + fmt(t.pnl);
  const wb = $('btn-work');
  wb.textContent = state.lastWorkDay === state.day ? '💼 已打工' : '💼 打工 +10,000';
}
function renderSchedule() {
  $('schedule-strip').innerHTML = state.races.map((r, i) => {
    const done = r.done;
    const cur = i === state.raceIdx;
    const label = done ? '✓ ' + HORSE_MAP[r.ranks[0]].name : (cur ? '▶ 進行中' : '・未開賽');
    return '<div class="shrink-0 w-24 rounded-xl border-2 px-2 py-1.5 text-center ' + (cur ? 'border-[#d9941a] bg-[#fff8e6]' : 'border-[#e6dcc5] bg-white') + '">'
      + '<div class="text-xs font-black truncate">' + esc(r.name) + '</div>'
      + '<div class="text-[10px] text-[#5c5346]">' + r.dist + 'm ' + r.turf + '地</div>'
      + '<div class="text-[10px] font-bold ' + (done ? 'text-[#1d6b41]' : 'text-[#5c5346]') + ' truncate">' + label + '</div></div>';
  }).join('');
}
function formText(hid) {
  const f = state.horseForm[hid];
  if (!f || !f.length) return '初出賽';
  return '近況 ' + f.join('・');
}
function renderBetSheet() {
  const el = $('bet-sheet');
  const race = currentRace();
  if (!race) { el.innerHTML = '<p class="text-sm text-[#5c5346]">今天的比賽都跑完了。</p>'; return; }
  if (race.done) {
    const b = race.bet;
    el.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・已跑完</h2>'
      + '<p class="text-sm mt-1">🥇 冠軍：' + esc(HORSE_MAP[race.ranks[0]].name) + '</p>'
      + (b ? '<p class="text-sm mt-1">' + (b.won > 0 ? '🎉 你的注單中了 +' + fmt(b.won) + ' 金' : '你的注單沒中，-' + fmt(b.amount) + ' 金') + '</p>' : '<p class="text-sm mt-1 text-[#5c5346]">這場你沒下注。</p>')
      + '<button type="button" class="gold-btn text-sm px-4 py-2.5 mt-3 w-full" onclick="' + (state.raceIdx >= 5 ? 'showDaySummary()' : 'nextRace()') + '">' + (state.raceIdx >= 5 ? '今日結算' : '下一場') + '</button>';
    return;
  }
  const need = BET_TYPES[betDraft.type].need;
  const odds = betDraft.picks.length === need ? betOddsFor(race) : 0;
  const rows = race.runners.map(r => {
    const h = HORSE_MAP[r.hid];
    const pickIdx = betDraft.picks.indexOf(r.hid);
    const picked = pickIdx >= 0;
    const badge = picked ? (betDraft.type === 'trifecta' ? '第' + (pickIdx + 1) + '名' : '✓ 已選') : '';
    return '<button type="button" onclick="togglePick(\'' + r.hid + '\')" class="w-full text-left p-2.5 rounded-xl border-2 mt-1.5 ' + (picked ? 'border-[#d9941a] bg-[#fff8e6]' : 'border-[#e6dcc5] bg-white') + '">'
      + '<div class="flex items-center gap-2.5"><img src="' + COATS[h.coat].img + '" alt="" class="w-11 h-11 object-cover rounded-lg border border-[#d8cbb3] bg-[#f4ede0] shrink-0">'
      + '<div class="flex-1 min-w-0"><div class="flex items-center justify-between gap-1"><span class="font-black text-sm truncate">' + esc(h.name) + (picked ? ' <span class="text-[#d9941a]">' + badge + '</span>' : '') + '</span>'
      + '<span class="text-sm font-black text-[#1d6b41] whitespace-nowrap">獨贏 ' + r.winOdds + ' 倍</span></div>'
      + '<div class="text-xs text-[#5c5346] mt-0.5">騎師 ' + esc(h.jockey) + '・' + h.turf + '地・' + h.dist + '距離・戰力 ' + Math.round(r.power) + '</div>'
      + '<div class="text-xs text-[#5c5346]">' + formText(r.hid) + '</div></div></div></button>';
  }).join('');
  const typeBtns = Object.keys(BET_TYPES).map(k => '<button type="button" onclick="setBetType(\'' + k + '\')" class="flex-1 py-2 text-sm ' + (betDraft.type === k ? 'gold-btn' : 'paper-btn') + '">' + BET_TYPES[k].label + '</button>').join('');
  const amountBtns = BET_AMOUNTS.map(a => '<button type="button" onclick="setBetAmount(' + a + ')" class="flex-1 py-1.5 text-xs ' + (betDraft.amount === a ? 'gold-btn' : 'paper-btn') + '">' + fmt(a) + '</button>').join('');
  let betArea = '';
  if (race.bet) {
    const b = race.bet;
    betArea = '<div class="bg-[#fff8e6] border-2 border-[#d9941a] rounded-xl p-3 mt-2 text-sm">'
      + '<div class="font-black">已下注：' + BET_TYPES[b.type].label + '・' + b.picks.map(p => esc(HORSE_MAP[p].name)).join(b.type === 'trifecta' ? ' → ' : '、') + '</div>'
      + '<div class="text-[#5c5346] mt-0.5">' + fmt(b.amount) + ' 金・賠率 ' + b.odds + ' 倍・中了拿 ' + fmt(Math.round(b.amount * b.odds)) + ' 金</div></div>'
      + '<button type="button" onclick="runRace()" class="green-btn text-base px-4 py-3 mt-3 w-full">🏇 看比賽</button>';
  } else {
    betArea = '<div class="flex gap-1.5 mt-2">' + typeBtns + '</div>'
      + '<p class="text-xs text-[#5c5346] mt-1">' + BET_TYPES[betDraft.type].hint + '</p>'
      + '<div class="flex gap-1.5 mt-2">' + amountBtns + '</div>'
      + '<div class="text-sm font-bold mt-2">下注 ' + fmt(betDraft.amount) + ' 金' + (odds > 0 ? '・賠率 ' + odds + ' 倍・中了拿 ' + fmt(Math.round(betDraft.amount * odds)) + ' 金' : '') + '</div>'
      + '<button type="button" onclick="placeBet()" class="gold-btn text-base px-4 py-3 mt-2 w-full">💰 下注 ' + fmt(betDraft.amount) + ' 金</button>'
      + '<button type="button" onclick="runRace()" class="paper-btn text-sm px-4 py-2 mt-2 w-full">不下注，直接看比賽</button>';
  }
  el.innerHTML = '<div class="flex items-center justify-between"><h2 class="font-black text-base">第 ' + (state.raceIdx + 1) + ' 場・' + esc(race.name) + '</h2><span class="chip bg-[#1d6b41] text-white">' + race.dist + 'm ' + race.turf + '地・' + race.distType + '距離</span></div>'
    + '<p class="text-xs text-[#5c5346] mt-1">點一匹馬選進注單，賠率越低越被看好。金色框是你押的馬，比賽時會放大顯示。</p>'
    + rows + betArea;
}
function renderRecords() {
  const s = state.stats;
  const hitRate = s.bets > 0 ? Math.round(s.hits / s.bets * 100) + '%' : '—';
  const pnl = s.returned - s.wagered;
  const cells = [
    ['下注場次', s.bets + ' 場'], ['命中率', hitRate], ['最高連勝', s.bestStreak + ' 連勝'],
    ['總投注', fmt(s.wagered)], ['總返還', fmt(s.returned)], ['總盈虧', (pnl >= 0 ? '+' : '') + fmt(pnl)],
  ];
  $('career-stats').innerHTML = cells.map(c => '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">' + c[0] + '</div><div class="font-black text-sm">' + c[1] + '</div></div>').join('');
  $('collection-grid').innerHTML = HORSES.map(h => {
    const st = state.horseStats[h.id];
    const seen = st && st.races > 0;
    return '<div class="text-center ' + (seen ? '' : 'opacity-50') + '">'
      + (seen ? '<img src="' + COATS[h.coat].img + '" alt="" class="w-full aspect-square object-cover rounded-xl border border-[#d8cbb3] bg-[#f4ede0]">' : '<div class="w-full aspect-square rounded-xl border border-[#d8cbb3] bg-[#f4ede0] flex items-center justify-center text-2xl">❓</div>')
      + '<div class="text-[10px] font-bold mt-0.5 truncate">' + esc(h.name) + '</div>'
      + '<div class="text-[10px] text-[#5c5346]">' + (seen ? st.wins + '勝/' + st.races + '戰' : '還沒出賽') + '</div></div>';
  }).join('');
  $('bet-log').innerHTML = state.logs.length ? state.logs.map(l => '<div>第' + l.day + '天：' + esc(l.text) + '</div>').join('') : '<div>還沒有投注紀錄。</div>';
}
function renderAll() {
  renderHeader();
  renderSchedule();
  renderBetSheet();
  if (currentView === 'records') renderRecords();
}

/* ================= 啟動 ================= */
window.addEventListener('load', () => {
  const loaded = loadState();
  if (loaded) { state = loaded; migrateState(); }
  else {
    const oldMoney = migratedMoney();
    state = createDefaultState(oldMoney >= 100000 ? oldMoney : 100000);
    if (oldMoney > 0) state.logs.unshift({ day: 1, text: '舊遊戲本金 ' + fmt(oldMoney) + ' 金已轉過來當下注本金。' });
    genDayRaces();
    saveState();
  }
  if (!state.races || !state.races.length) { genDayRaces(); saveState(); }
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('btn-mute').addEventListener('click', () => { setMuted(!isMuted()); sfx('tap'); });
  $('btn-work').addEventListener('click', doWork);
  setMuted(isMuted());
  renderAll();
});
</script>
</body>
