/* ================= 音效（WebAudio 合成，無外部檔案） ================= */
let audioCtx = null;

function tone(freq, dur, type, vol, delay) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function sfx(kind) {
  if (isMuted()) return;
  if (kind === 'tap') tone(660, 0.07, 'square', 0.05);
  else if (kind === 'coin') { tone(950, 0.08, 'sine', 0.12); tone(1420, 0.16, 'sine', 0.12, 0.08); }
  else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.14, i * 0.11)); }
  else if (kind === 'lose') { tone(320, 0.2, 'sine', 0.1); tone(210, 0.3, 'sine', 0.1, 0.18); }
  else if (kind === 'whistle') { tone(2200, 0.12, 'sine', 0.07); tone(2200, 0.2, 'sine', 0.07, 0.16); }
  else if (kind === 'count') tone(880, 0.09, 'sine', 0.1);
  else if (kind === 'go') { tone(1047, 0.2, 'triangle', 0.14); tone(1568, 0.3, 'triangle', 0.12, 0.12); }
  else if (kind === 'gate') { tone(55, 0.18, 'sine', 0.25); tone(2200, 0.1, 'sine', 0.06); }
  else if (kind === 'fall') { tone(380, 0.12, 'sawtooth', 0.07); tone(110, 0.25, 'sine', 0.16, 0.1); }
  else if (kind === 'awaken') { [660, 880, 1320].forEach((f, i) => tone(f, 0.12, 'triangle', 0.1, i * 0.07)); }
}
/* 馬蹄聲循環 + 觀眾歡呼（WebAudio 合成） */
let gallopTimer = null;
let gallopStep = 0;
function startGallop() {
  if (isMuted()) return;
  stopGallop();
  gallopStep = 0;
  gallopTimer = setInterval(() => {
    if (isMuted()) { stopGallop(); return; }
    gallopStep++;
    if (gallopStep % 4 === 0) return;
    tone(gallopStep % 2 === 0 ? 95 : 70, 0.09, 'triangle', 0.15);
  }, 170);
}
function stopGallop() { if (gallopTimer) { clearInterval(gallopTimer); gallopTimer = null; } }
function cheer(big) {
  if (isMuted()) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dur = big ? 1.8 : 1.0;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const p = i / data.length;
      data[i] = (Math.random() * 2 - 1) * (p < 0.3 ? p / 0.3 : 1 - (p - 0.3) / 0.7);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.6;
    const g = audioCtx.createGain();
    g.gain.value = big ? 0.22 : 0.12;
    src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
    src.start();
    tone(1047, 0.2, 'triangle', 0.1, 0.1); tone(1319, 0.25, 'triangle', 0.1, 0.25);
  } catch (e) {}
}

  if (!state.horseForm) state.horseForm = {};
  if (!state.horseStats) state.horseStats = {};
  if (state.vip === undefined) state.vip = 0;
  if (state.namedRace === undefined) state.namedRace = null;
  if (!state.trophies) state.trophies = {};
  if (state.ownedHorseId === undefined) state.ownedHorseId = null;
  if (!state.races) state.races = [];
  if (state.lastWorkDay === undefined) state.lastWorkDay = 0;
  if (state.lastReliefDay === undefined) state.lastReliefDay = 0;
  if (!state.logs) state.logs = [];
}
function migratedMoney() {
  try {
    const raw = localStorage.getItem(OLD_SAVE_KEY);
    if (!raw) return 0;
    const old = JSON.parse(raw);
    return (old && typeof old.money === 'number') ? old.money : 0;
  } catch (e) { return 0; }
}
function showToast(text) {
  const el = $('toast-banner');
  if (!el) return;
  el.textContent = text;
  el.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}
function addLog(text) {

  if (state.logs.length > 40) state.logs.length = 40;
}

/* ================= 實力與賠率 ================= */
function formBonus(hid) {
  const f = state.horseForm[hid];
  if (!f || !f.length) return 0;
  const avg = f.reduce((a, b) => a + b, 0) / f.length;
  return clamp((4 - avg) * 1.5, -4.5, 4.5);
}
function horsePower(h, race) {
  const w = DIST_WEIGHTS[race.distType] || DIST_WEIGHTS['中'];
  const base = speedStat(h) * w.spd + staminaStat(h) * w.sta + kickStat(h) * w.kick;
  const turfFit = h.turf === race.turf ? 1.10 : 0.90;
  const distFit = h.dist === race.distType ? 1.05 : 0.95;
  let wMult = 1;
  if (race.weather === 'rain') wMult = h.turf === '泥' ? 1.10 : 0.94;
  return base * turfFit * distFit * wMult + formBonus(h.id);
}
function estimateWinProbs(race, sims) {
  const wins = {};
  race.runners.forEach(r => { wins[r.hid] = 0; });
  for (let i = 0; i < sims; i++) {
    const out = buildOutcome(race);
    const top = out.runners.slice().sort((a, b) => b.eff - a.eff)[0];
    wins[top.hid]++;
  }
  return wins;
}
function calcOdds(runners, race) {
  const wins = estimateWinProbs(race, 200);
  runners.forEach(r => {
    const p = Math.max(wins[r.hid], 1) / 200;
    r.winOdds = round1(clamp(0.85 / p, 1.2, 40));
    r.placeOdds = round1(Math.max(1.1, r.winOdds * 0.35));
  });
}
function comboOdds(type, picks, race) {
  const byId = {};
  race.runners.forEach(r => { byId[r.hid] = r; });
  if (type === 'quinella' && picks.length === 2) {
    return round1(clamp(byId[picks[0]].winOdds * byId[picks[1]].winOdds / 8, 2, 60));
  }
  if (type === 'trifecta' && picks.length === 3) {
    return round1(clamp(byId[picks[0]].winOdds * byId[picks[1]].winOdds * byId[picks[2]].winOdds / 40, 10, 300));
  }
  return 0;
}
function payoutFor(bet, ranks) {
  const amt = bet.amount;
  if (bet.type === 'win') return ranks[0] === bet.picks[0] ? Math.round(amt * bet.odds) : 0;
  if (bet.type === 'place') return ranks.slice(0, 3).includes(bet.picks[0]) ? Math.round(amt * bet.odds) : 0;
  if (bet.type === 'quinella') { const top2 = ranks.slice(0, 2); return bet.picks.every(p => top2.includes(p)) ? Math.round(amt * bet.odds) : 0; }
  if (bet.type === 'trifecta') return ranks[0] === bet.picks[0] && ranks[1] === bet.picks[1] && ranks[2] === bet.picks[2] ? Math.round(amt * bet.odds) : 0;
  return 0;
}

function effFor(power) { return power * (0.78 + Math.random() * 0.44); }
function rollEvent(h, race) {
  const r = Math.random();
  const awakenUp = race && race.weather === 'cloudy' ? 0.15 : 0.09;
  if (r < 0.03) return { event: 'fall', mult: 0.55 };
  if (r < awakenUp) return { event: 'awaken', mult: 1.25 };
  if (r < 0.17) return { event: 'slow', mult: 0.92 };
  if (r < 0.22) return { event: 'jockey', mult: 0.94 };
  if (kickStat(h) >= 82 && r < 0.37) return { event: 'kick', mult: 1.12 };
  return { event: null, mult: 1 };
}
function buildOutcome(race) {
  return { runners: race.runners.map(r => {
    const h = HORSE_MAP[r.hid];
    const ev = rollEvent(h, race);
    const dayForm = 0.86 + Math.random() * 0.28;
    return { hid: r.hid, name: h.name, coat: h.coat, eff: effFor(r.power) * dayForm * ev.mult, event: ev.event, isPicked: race.bet ? race.bet.picks.includes(r.hid) : false };
  }) };
}
function eventText(ev, name) {
  if (ev === 'fall') return '💥「' + name + '」摔馬了！';
  if (ev === 'awaken') return '⚡「' + name + '」忽然覺醒，後勁全開！';
  if (ev === 'slow') return '🐢「' + name + '」出閘慢了一拍！';
  if (ev === 'jockey') return '😖「' + name + '」的騎師失誤了！';
  if (ev === 'kick') return '🔥「' + name + '」末腳爆發！';
  return '';
}
function eventReveal(outcome, overall) {
  const defs = [['fall', 0.45], ['awaken', 0.5], ['kick', 0.6], ['slow', 0.3], ['jockey', 0.35]];
  let best = null;
  defs.forEach(d => {
    if (overall < d[1]) return;
    const r = outcome.runners.find(x => x.event === d[0]);
    if (r && (!best || d[1] > best[1])) best = [r, d[1], d[0]];
  });
  return best ? eventText(best[2], best[0].name) : '';
}

/* ================= 賽程 ================= */
function rollWeather() {
  const r = Math.random();
  if (r < 0.5) return 'sunny';
  if (r < 0.8) return 'rain';
  return 'cloudy';
}
function ownerRaceIdx() {
  return shuffle([0, 1, 2, 3, 4, 5]).slice(0, 2);
}
function genDayRaces() {
  const named = state.namedRace && state.namedRace.untilDay >= state.day ? state.namedRace.name : null;
  const ownIdx = state.ownedHorseId ? ownerRaceIdx() : [];
  state.races = RACE_SCHEDULE.map((rs, idx) => {
    const race = { id: rs.id, name: (idx === 5 && named) ? named + '・天駒大賽' : rs.name, grade: rs.grade, dist: rs.dist, turf: rs.turf, distType: rs.distType, weather: rollWeather(), runners: [], done: false, ranks: [], bet: null };
    const win = CLASS_WINDOWS[idx];
    const ranked = HORSES.slice().sort((a, b) => horsePower(b, race) - horsePower(a, race));
    let field = shuffle(ranked.slice(win[0], win[1])).slice(0, 8);
    if (state.ownedHorseId && ownIdx.includes(idx) && !field.some(h => h.id === state.ownedHorseId)) field[7] = HORSE_MAP[state.ownedHorseId];
    race.runners = field.map(h => {
      const power = horsePower(h, race);
      return { hid: h.id, power: power, winOdds: 0, placeOdds: 0 };
    });
    calcOdds(race.runners, race);
    return race;
  });
}
function currentRace() { return state.races[state.raceIdx] || null; }
function todayStats() {
  let wagered = 0, returned = 0, hits = 0, bets = 0;
  state.races.forEach(r => { if (r.bet) { bets += 1; wagered += r.bet.amount; returned += (r.bet.won || 0); if ((r.bet.won || 0) > 0) hits += 1; } });
  return { bets: bets, hits: hits, wagered: wagered, returned: returned, pnl: returned - wagered };
}

/* ================= 下注 ================= */
let betDraft = { type: 'win', picks: [], amount: 10000 };
function setBetType(t) { betDraft.type = t; betDraft.picks = []; sfx('tap'); renderBetSheet(); }
function setBetAmount(a) { betDraft.amount = clamp(Math.round(a) || 1000, 1000, Math.max(1000, state.money)); sfx('tap'); renderBetSheet(); }
function betAllIn() { betDraft.amount = Math.max(1000, state.money); sfx('tap'); renderBetSheet(); }
function setCustomAmount(v) { setBetAmount(parseInt(v, 10)); }
function togglePick(hid) {
  const need = BET_TYPES[betDraft.type].need;
  const i = betDraft.picks.indexOf(hid);
  if (i >= 0) { betDraft.picks.splice(i, 1); }
  else {
    if (betDraft.picks.length >= need) betDraft.picks.shift();
    betDraft.picks.push(hid);
  }
  sfx('tap');
  renderBetSheet();
}
function betOddsFor(race) {
  if (betDraft.type === 'win') return race.runners.find(r => r.hid === betDraft.picks[0]).winOdds;
  if (betDraft.type === 'place') return race.runners.find(r => r.hid === betDraft.picks[0]).placeOdds;
  return comboOdds(betDraft.type, betDraft.picks, race);
}
function placeBet() {
  const race = currentRace();
  if (!race || race.done || racing) return;
  const need = BET_TYPES[betDraft.type].need;
  if (betDraft.picks.length !== need) { showToast('請選 ' + need + ' 匹馬'); return; }
  if (betDraft.amount < 1000) { showToast('最少押 1,000 金'); return; }
  if (state.money < betDraft.amount) { showToast('金不夠，下注要 ' + fmt(betDraft.amount) + ' 金'); return; }
  const odds = betOddsFor(race);
  state.money -= betDraft.amount;
  state.stats.bets += 1;
  state.stats.wagered += betDraft.amount;
  race.bet = { type: betDraft.type, picks: betDraft.picks.slice(), amount: betDraft.amount, odds: odds, won: 0 };
  sfx('coin');
  saveState();
  renderAll();
}
function doWork() {
  if (state.lastWorkDay === state.day) { showToast('今天已經打過工了，明天再來'); return; }
  state.lastWorkDay = state.day;
  state.money += WORK_PAY;
  addLog('💼 打工賺 +' + fmt(WORK_PAY) + ' 金');
  showToast('打工賺 +' + fmt(WORK_PAY) + ' 金！');
  sfx('coin');
  saveState();
  renderAll();
}
function checkRelief() {
  if (state.money < 1000 && state.lastReliefDay !== state.day) {
    state.lastReliefDay = state.day;
    state.money += RELIEF_PAY;
    addLog('🆘 破產救濟金 +' + fmt(RELIEF_PAY) + ' 金');
    showToast('金快用完，發救濟金 +' + fmt(RELIEF_PAY) + '！');
    saveState();
  }
}

function vipBonus() { const t = VIP_TIERS.find(x => x.level === state.vip); return t ? t.bonus : 0; }
function buyVip(level) {

}
function buyNaming(name) {

function buyTrophy(id) {

function ownerPrice(hid) {

}
function buyHorse(hid) {
  const h = HORSE_MAP[hid];
  if (!h) return;
  if (state.ownedHorseId === hid) return;
  const price = ownerPrice(hid);
  if (state.money < price) { showToast('金不夠，買下「' + h.name + '」要 ' + fmt(price) + ' 金'); return; }
  const prev = state.ownedHorseId ? HORSE_MAP[state.ownedHorseId].name : null;
  state.money -= price;
  state.ownedHorseId = hid;
  addLog('🐴 買下賽馬「' + h.name + '」（' + fmt(price) + ' 金）' + (prev ? '，放掉了「' + prev + '」' : '') + '，牠贏了你有馬主獎金');

/* ================= 比賽 ================= */
function raceCommentAt(prog, leaderName) {
  if (prog >= 0.75) return '最後直線！名次藏起來了，「' + leaderName + '」領先，但誰會贏還不知道！';
  if (prog >= 0.6) return '進入彎道，「' + leaderName + '」暫時領先！';
  if (prog >= 0.3) return '中段，各馬展開爭奪！';
  return '閘門開了！各馬衝出起跑線！';
}
function skipRace() {
  if (!raceAnim || raceAnim.done) return;
  stopGallop();
  raceAnim.done = true;
  raceAnim.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
  raceAnim.onFinish();
}
function startRaceAnimation(race, outcome, onFinish) {
  raceAnim = { done: false, timers: [], onFinish: onFinish };
  const live = $('race-live');
  live.classList.remove('hidden');
  const counts = ['3', '2', '1', '跑！'];
  let ci = 0;
  live.innerHTML = '<div class="text-center py-10"><div id="count-num" class="text-7xl font-black text-[#1d4d2e]">3</div><div class="text-sm text-[#5c5346] mt-2">預備…</div></div>'
    + '<div class="text-center"><button type="button" id="btn-skip-race" class="paper-btn text-xs px-3 py-1.5">⏩ 跳過比賽</button></div>';
  live.scrollIntoView({ behavior: 'smooth', block: 'center' });
  sfx('count');
  const wireSkip = () => { const b = $('btn-skip-race'); if (b) b.addEventListener('click', skipRace); };
  wireSkip();
  const cdTimer = setInterval(() => {
    ci++;
    if (ci >= counts.length) { clearInterval(cdTimer); sfx('go'); runScene(); return; }
    const el = $('count-num');
    if (el) el.textContent = counts[ci];
    sfx('count');
  }, 1000);
  raceAnim.timers.push(cdTimer);
  function runScene() {
    live.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・' + race.dist + 'm ' + race.turf + '地 ' + (WEATHERS[race.weather] || WEATHERS.sunny).icon + '進行中…</h2>'
      + '<div class="text-center mt-2"><button type="button" id="btn-skip-race" class="paper-btn text-xs px-3 py-1.5">⏩ 跳過比賽</button></div>'
      + '<div class="race-scene mt-3"><div class="race-flag"></div>' + outcome.runners.map((r, i) =>
        '<div class="race-lane-row"><span class="lane-name">' + esc(r.name) + '</span>'
        + '<div class="race-token' + (r.isPicked ? ' me bob' : ' bob') + '" id="lane-' + i + '" style="left:6%">' + '<img src="' + COATS[r.coat].img + '" alt="">' + '</div>'
        + '<span class="lane-pos" id="lane-pos-' + i + '">-</span></div>').join('') + '</div>'
      + '<div id="race-comment" class="text-sm font-bold text-[#1d4d2e] mt-2">閘門開了！各馬衝出起跑線！</div>';
    wireSkip();
    sfx('gate'); startGallop();
    const maxEff = Math.max.apply(null, outcome.runners.map(r => r.eff));
    const minEff = Math.min.apply(null, outcome.runners.map(r => r.eff));
    const durs = outcome.runners.map(r => Math.min(7000, 5200 * (maxEff / r.eff)));
    const effDurs = outcome.runners.map((r, i) => r.event === 'fall' ? durs[i] * 0.45 : durs[i]);
    const maxDur = 5200 * (maxEff / minEff);
    const startAt = Date.now();
    outcome.runners.forEach((r, i) => {
      const tok = $('lane-' + i);
      if (tok) {
        const fall = r.event === 'fall';
        tok.style.transition = 'left ' + effDurs[i] + 'ms linear';
        void tok.offsetWidth;
        requestAnimationFrame(() => { requestAnimationFrame(() => { tok.style.left = fall ? '42%' : '92%'; }); });
      }
    });
    const posTimer = setInterval(() => {
      const elapsed = Date.now() - startAt;
      const prog = effDurs.map(d => clamp(elapsed / d, 0, 1));
      const overall = clamp(elapsed / Math.min(7000, maxDur), 0, 1);
      const leaderIdx = prog.map((p, j) => ({ j: j, p: p })).sort((a, b) => b.p - a.p)[0].j;
      const comment = $('race-comment');
      if (comment) {
        const evText = eventReveal(outcome, overall);
        comment.textContent = evText || raceCommentAt(overall, outcome.runners[leaderIdx].name);
      }
      outcome.runners.forEach((r, i) => {
        const tok = $('lane-' + i);
        if (tok && r.event === 'awaken' && overall >= 0.5 && !tok.classList.contains('awake')) { tok.classList.add('awake'); sfx('awaken'); }
        if (tok && r.event === 'fall' && overall >= 0.45 && !tok.classList.contains('fallen')) { tok.classList.add('fallen'); sfx('fall'); }
        const pos = $('lane-pos-' + i);
        if (!pos) return;
        if (r.event === 'fall' && overall >= 0.45) { pos.textContent = '💥摔馬'; return; }
        if (overall >= 0.75) { pos.textContent = '？'; return; }
        const cur = prog.map((p, j) => ({ j: j, p: p })).sort((a, b) => b.p - a.p).findIndex(x => x.j === i) + 1;
        pos.textContent = '第' + cur + '名';
      });
    }, 200);
    raceAnim.timers.push(posTimer);
    const to = setTimeout(() => {
      clearInterval(posTimer);
      if (raceAnim.done) return;
      raceAnim.done = true;
      onFinish();
    }, Math.min(7000, maxDur) + 700);
    raceAnim.timers.push(to);
  }
}
function runRace() {
  if (racing) return;
  const race = currentRace();
  if (!race || race.done) return;
  racing = true;
  sfx('whistle');
  const outcome = buildOutcome(race);
  $('race-result').classList.add('hidden');
  startRaceAnimation(race, outcome, () => { racing = false; finishRace(race, outcome); });
}
function finishRace(race, outcome) {
  stopGallop();
  const sorted = outcome.runners.slice().sort((a, b) => b.eff - a.eff);
  const ranks = sorted.map(r => r.hid);
  race.done = true;
  race.ranks = ranks;
  race.events = outcome.runners.filter(r => r.event).map(r => ({ hid: r.hid, event: r.event }));
  ranks.forEach((hid, i) => {
    const f = (state.horseForm[hid] = state.horseForm[hid] || []);
    f.unshift(i + 1); if (f.length > 3) f.length = 3;
    const st = (state.horseStats[hid] = state.horseStats[hid] || { races: 0, wins: 0 });
    st.races += 1; if (i === 0) st.wins += 1;
  });
  let betHtml = '';
  if (race.bet) {
    const b = race.bet;
    const rawPayout = payoutFor(b, ranks);
    const payout = Math.round(rawPayout * (1 + vipBonus()));
    b.won = payout;
    state.stats.returned += payout;
    if (payout > 0) {
      state.money += payout;
      state.stats.hits += 1;
      state.stats.streak += 1;
      state.stats.bestStreak = Math.max(state.stats.bestStreak, state.stats.streak);
      state.stats.bestWin = Math.max(state.stats.bestWin, payout - b.amount);
      betHtml = '<div class="text-lg font-black text-[#1d6b41] mt-1">🎉 中了！' + BET_TYPES[b.type].label + ' +' + fmt(payout) + ' 金（淨賺 +' + fmt(payout - b.amount) + '）' + (vipBonus() > 0 ? '（VIP +' + Math.round(vipBonus() * 100) + '%）' : '') + '</div>';
      sfx('win'); sfx('coin');
      cheer(true);
    } else {
      state.stats.streak = 0;
      betHtml = '<div class="text-sm font-bold text-[#9e2a22] mt-1">沒中，-' + fmt(b.amount) + ' 金</div>';
      sfx('lose');
      cheer(false);
    }
    addLog(race.name + '：' + BET_TYPES[b.type].label + ' ' + fmt(b.amount) + ' 金，' + (payout > 0 ? '中 +' + fmt(payout) : '沒中'));
  } else {
    addLog(race.name + '：沒下注，只看比賽（冠軍 ' + HORSE_MAP[ranks[0]].name + '）');
    cheer(false);
  }
  let ownerHtml = '';
  if (state.ownedHorseId) {
    const oi = ranks.indexOf(state.ownedHorseId);
    let bonus = 0;
    if (oi === 0) bonus = race.grade === 'G1' ? OWNER_G1_BONUS : OWNER_WIN_BONUS;
    else if (oi === 1 || oi === 2) bonus = OWNER_PLACE_BONUS;
    if (bonus > 0) {
      state.money += bonus;
      ownerHtml = '<div class="text-sm font-black text-[#d9941a] mt-1">👑 你的馬「' + esc(HORSE_MAP[state.ownedHorseId].name) + '」第' + (oi + 1) + '名！馬主獎金 +' + fmt(bonus) + ' 金</div>';
      addLog('👑 馬主獎金 +' + fmt(bonus) + ' 金（' + HORSE_MAP[state.ownedHorseId].name + ' 第' + (oi + 1) + '名）');
    }
  }
  const isLast = state.raceIdx >= 5;
  const res = $('race-result');
  $('race-live').classList.add('hidden');
  res.classList.remove('hidden');
  const evByHid = {};
  outcome.runners.forEach(r => { if (r.event) evByHid[r.hid] = r.event; });
  const evShort = { fall: '💥摔馬', awaken: '⚡覺醒', slow: '🐢慢閘', jockey: '😖失誤', kick: '🔥末腳' };
  const evs = outcome.runners.filter(r => r.event);
  const winRunner = race.runners.find(r => r.hid === ranks[0]);
  const coldHtml = (winRunner && winRunner.winOdds >= 8) ? '<div class="text-sm font-black text-[#d9941a] mt-1">🎲 大冷門！賠率 ' + winRunner.winOdds + ' 倍的「' + esc(HORSE_MAP[ranks[0]].name) + '」爆冷奪冠！</div>' : '';
  res.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・結果</h2>'
    + '<div class="text-center py-3"><div class="text-3xl font-black">🥇 ' + esc(HORSE_MAP[ranks[0]].name) + '</div>' + coldHtml
    + betHtml
    + ownerHtml
    + '</div>'
    + (evs.length ? '<div class="text-xs text-[#5c5346]">🎲 本場意外：' + evs.map(r => eventText(r.event, HORSE_MAP[r.hid].name)).join('　') + '</div>' : '')
    + '<div class="text-xs text-[#5c5346] space-y-1 border-t pt-2">' + ranks.map((hid, i) => '<div>第' + (i + 1) + '名　' + esc(HORSE_MAP[hid].name) + (evByHid[hid] ? ' ' + evShort[evByHid[hid]] : '') + (race.bet && race.bet.picks.includes(hid) ? '（你押的）' : '') + (state.ownedHorseId === hid ? ' 👑我的馬' : '') + '</div>').join('') + '</div>'
    + '<button type="button" id="btn-next-race" class="gold-btn text-sm px-4 py-2.5 mt-3 w-full">' + (isLast ? '今日結算' : '下一場') + '</button>';
  $('btn-next-race').addEventListener('click', () => { if (isLast) showDaySummary(); else nextRace(); });
  res.scrollIntoView({ behavior: 'smooth', block: 'center' });
  saveState();
  renderAll();
  checkRelief();
}
function nextRace() {
  if (state.raceIdx < 5) {
    state.raceIdx += 1;
    betDraft = { type: 'win', picks: [], amount: 10000 };
    $('race-live').classList.add('hidden');
    $('race-result').classList.add('hidden');
    saveState();
    renderAll();
    window.scrollTo({ top: 0 });
  }
}
function showDaySummary() {
  const t = todayStats();
  const res = $('race-result');
  res.classList.remove('hidden');
  res.innerHTML = '<h2 class="font-black text-base">📅 第 ' + state.day + ' 天結算</h2>'
    + '<div class="grid grid-cols-3 gap-2 mt-3 text-center text-sm">'
    + '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">下注</div><div class="font-black">' + t.bets + ' 場</div></div>'
    + '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">命中</div><div class="font-black">' + t.hits + ' 場</div></div>'
    + '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">今日盈虧</div><div class="font-black ' + (t.pnl >= 0 ? 'text-[#1d6b41]' : 'text-[#9e2a22]') + '">' + (t.pnl >= 0 ? '+' : '') + fmt(t.pnl) + '</div></div>'
    + '</div>'
    + '<p class="text-xs text-[#5c5346] mt-2">明日賽程重新抽籤（含天氣），馬匹近況會帶著走，連勝的馬賠率會變低。</p>'
    + '<button type="button" id="btn-next-day" class="gold-btn text-sm px-4 py-2.5 mt-3 w-full">進入第 ' + (state.day + 1) + ' 天</button>';
  $('btn-next-day').addEventListener('click', nextDay);
  res.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function nextDay() {
  state.day += 1;
  state.raceIdx = 0;
  betDraft = { type: 'win', picks: [], amount: 10000 };
  genDayRaces();
  $('race-live').classList.add('hidden');
  $('race-result').classList.add('hidden');
  saveState();
  renderAll();
  window.scrollTo({ top: 0 });
}

/* ================= 渲染 ================= */
function switchView(view) {
  currentView = view;
  $('view-race').classList.toggle('hidden', view !== 'race');
  $('view-records').classList.toggle('hidden', view !== 'records');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'records') renderRecords();
  sfx('tap');
}
function renderHeader() {
  $('header-day').textContent = '第 ' + state.day + ' 天・第 ' + (state.raceIdx + 1) + ' 場 / 6 場';
  $('header-money').textContent = '💰 ' + fmt(state.money) + (state.vip ? ' 👑' + VIP_TIERS[state.vip - 1].name : '');
  const t = todayStats();
  $('header-today').textContent = '今日 ' + t.hits + '勝/' + t.bets + '注・' + (t.pnl >= 0 ? '+' : '') + fmt(t.pnl);
  const wb = $('btn-work');
  wb.textContent = state.lastWorkDay === state.day ? '💼 已打工' : '💼 打工 +10,000';
}
function renderSchedule() {
  $('schedule-strip').innerHTML = state.races.map((r, i) => {
    const done = r.done;
    const cur = i === state.raceIdx;
    const label = done ? '✓ ' + HORSE_MAP[r.ranks[0]].name : (cur ? '▶ 進行中' : '・未開賽');
    return '<div class="shrink-0 w-24 rounded-xl border-2 px-2 py-1.5 text-center ' + (cur ? 'border-[#d9941a] bg-[#fff8e6]' : 'border-[#e6dcc5] bg-white') + '">'
      + '<div class="text-xs font-black truncate">' + esc(r.name) + '</div>'
      + '<div class="text-[10px] text-[#5c5346]">' + r.dist + 'm ' + r.turf + '地 ' + (WEATHERS[r.weather] || WEATHERS.sunny).icon + '</div>'
      + '<div class="text-[10px] font-bold ' + (done ? 'text-[#1d6b41]' : 'text-[#5c5346]') + ' truncate">' + label + '</div></div>';
  }).join('');
}
function formText(hid) {
  const f = state.horseForm[hid];
  if (!f || !f.length) return '初出賽';
  return '近況 ' + f.join('・');
}
function renderBetSheet() {
  const el = $('bet-sheet');
  const race = currentRace();
  if (!race) { el.innerHTML = '<p class="text-sm text-[#5c5346]">今天的比賽都跑完了。</p>'; return; }
  if (race.done) {
    const b = race.bet;
    el.innerHTML = '<h2 class="font-black text-base">' + esc(race.name) + '・已跑完</h2>'
      + '<p class="text-sm mt-1">🥇 冠軍：' + esc(HORSE_MAP[race.ranks[0]].name) + '</p>'
      + (b ? '<p class="text-sm mt-1">' + (b.won > 0 ? '🎉 你的注單中了 +' + fmt(b.won) + ' 金' : '你的注單沒中，-' + fmt(b.amount) + ' 金') + '</p>' : '<p class="text-sm mt-1 text-[#5c5346]">這場你沒下注。</p>')
      + '<button type="button" class="gold-btn text-sm px-4 py-2.5 mt-3 w-full" onclick="' + (state.raceIdx >= 5 ? 'showDaySummary()' : 'nextRace()') + '">' + (state.raceIdx >= 5 ? '今日結算' : '下一場') + '</button>';
    return;
  }
  const need = BET_TYPES[betDraft.type].need;
  const odds = betDraft.picks.length === need ? betOddsFor(race) : 0;
  const rows = race.runners.map(r => {
    const h = HORSE_MAP[r.hid];
    const pickIdx = betDraft.picks.indexOf(r.hid);
    const picked = pickIdx >= 0;
    const badge = picked ? (betDraft.type === 'trifecta' ? '第' + (pickIdx + 1) + '名' : '✓ 已選') : '';
    return '<button type="button" onclick="togglePick(\'' + r.hid + '\')" class="w-full text-left p-2.5 rounded-xl border-2 mt-1.5 ' + (picked ? 'border-[#d9941a] bg-[#fff8e6]' : 'border-[#e6dcc5] bg-white') + '">'
      + '<div class="flex items-center gap-2.5"><img src="' + COATS[h.coat].img + '" alt="" class="w-11 h-11 object-cover rounded-lg border border-[#d8cbb3] bg-[#f4ede0] shrink-0">'
      + '<div class="flex-1 min-w-0"><div class="flex items-center justify-between gap-1"><span class="font-black text-sm truncate">' + esc(h.name) + (state.ownedHorseId === r.hid ? ' 👑' : '') + (picked ? ' <span class="text-[#d9941a]">' + badge + '</span>' : '') + '</span>'
      + '<span class="text-sm font-black text-[#1d6b41] whitespace-nowrap">獨贏 ' + r.winOdds + ' 倍</span></div>'
      + '<div class="text-xs text-[#5c5346] mt-0.5">騎師 ' + esc(h.jockey) + '・' + h.turf + '地・' + h.dist + '距離</div>'
      + '<div class="text-xs mt-0.5">速 <b class="' + (DIST_WEIGHTS[race.distType].spd >= 0.5 ? 'text-[#1d6b41]' : '') + '">' + speedStat(h) + '</b>・耐 <b class="' + (DIST_WEIGHTS[race.distType].sta >= 0.5 ? 'text-[#1d6b41]' : '') + '">' + staminaStat(h) + '</b>・爆 <b>' + kickStat(h) + '</b></div>'
      + '<div class="text-xs text-[#5c5346]">' + formText(r.hid) + '</div></div></div></button>';
  }).join('');
  const typeBtns = Object.keys(BET_TYPES).map(k => '<button type="button" onclick="setBetType(\'' + k + '\')" class="flex-1 py-2 text-sm ' + (betDraft.type === k ? 'gold-btn' : 'paper-btn') + '">' + BET_TYPES[k].label + '</button>').join('');
  const amountBtns = BET_CHIPS.map(a => '<button type="button" onclick="setBetAmount(' + a + ')" class="flex-1 py-1.5 text-xs ' + (betDraft.amount === a ? 'gold-btn' : 'paper-btn') + '">' + fmt(a) + '</button>').join('')
    + '<button type="button" onclick="betAllIn()" class="flex-1 py-1.5 text-xs ' + (betDraft.amount === state.money ? 'gold-btn' : 'paper-btn') + '">全部</button>';
  const customInput = '<div class="flex items-center gap-1.5 mt-1.5"><span class="text-xs font-bold text-[#5c5346] whitespace-nowrap">自訂金額</span><input type="number" min="1000" step="1000" value="' + betDraft.amount + '" onchange="setCustomAmount(this.value)" class="flex-1 min-w-0 text-sm font-bold border border-[#d8cbb3] rounded-lg px-2 py-1.5 bg-white"><span class="text-xs text-[#5c5346] whitespace-nowrap">金（無上限）</span></div>';
  let betArea = '';
  if (race.bet) {
    const b = race.bet;
    betArea = '<div class="bg-[#fff8e6] border-2 border-[#d9941a] rounded-xl p-3 mt-2 text-sm">'
      + '<div class="font-black">已下注：' + BET_TYPES[b.type].label + '・' + b.picks.map(p => esc(HORSE_MAP[p].name)).join(b.type === 'trifecta' ? ' → ' : '、') + '</div>'
      + '<div class="text-[#5c5346] mt-0.5">' + fmt(b.amount) + ' 金・賠率 ' + b.odds + ' 倍・中了拿 ' + fmt(Math.round(b.amount * b.odds)) + ' 金</div></div>'
      + '<button type="button" onclick="runRace()" class="green-btn text-base px-4 py-3 mt-3 w-full">🏇 看比賽</button>';
  } else {
    betArea = '<div class="flex gap-1.5 mt-2">' + typeBtns + '</div>'
      + '<p class="text-xs text-[#5c5346] mt-1">' + BET_TYPES[betDraft.type].hint + '</p>'
      + '<div class="flex gap-1.5 mt-2">' + amountBtns + '</div>' + customInput
      + '<div class="text-sm font-bold mt-2">下注 ' + fmt(betDraft.amount) + ' 金' + (odds > 0 ? '・賠率 ' + odds + ' 倍・中了拿 ' + fmt(Math.round(betDraft.amount * odds)) + ' 金' : '') + '</div>'
      + '<button type="button" onclick="placeBet()" class="gold-btn text-base px-4 py-3 mt-2 w-full">💰 下注 ' + fmt(betDraft.amount) + ' 金</button>'
      + '<button type="button" onclick="runRace()" class="paper-btn text-sm px-4 py-2 mt-2 w-full">不下注，直接看比賽</button>';
  }
  el.innerHTML = '<div class="flex items-center justify-between"><h2 class="font-black text-base">第 ' + (state.raceIdx + 1) + ' 場・' + esc(race.name) + '</h2><span class="chip bg-[#1d6b41] text-white">' + race.dist + 'm ' + race.turf + '地・' + race.distType + '距離 ' + (WEATHERS[race.weather] || WEATHERS.sunny).icon + '</span></div>'
    + '<p class="text-xs text-[#5c5346] mt-1">' + (WEATHERS[race.weather] || WEATHERS.sunny).hint + '。' + distHintText(race.distType) + '。⚠️ 沒有萬能馬：摔馬、覺醒、天氣都可能改寫結果。</p>'
    + rows + betArea;
}
function renderSpend() {
  const vipBtns = VIP_TIERS.map(t => {
    const owned = state.vip >= t.level;
    const next = state.vip + 1 === t.level;
    return '<div class="flex items-center justify-between gap-2 py-1.5 border-b border-[#e6dcc5] last:border-0">'
      + '<div><div class="font-black text-sm">👑 VIP ' + t.name + '</div><div class="text-xs text-[#5c5346]">派彩 +' + Math.round(t.bonus * 100) + '%</div></div>'
      + (owned ? '<span class="chip bg-[#1d6b41] text-white">已擁有</span>'
        : '<button type="button" onclick="buyVip(' + t.level + ')" class="gold-btn text-xs px-3 py-1.5 whitespace-nowrap"' + (next ? '' : ' disabled style="opacity:.4"') + '>' + fmt(t.price) + ' 金</button>')
      + '</div>';
  }).join('');
  const naming = state.namedRace && state.namedRace.untilDay >= state.day;
  const trophyBtns = TROPHIES.map(t => '<div class="flex items-center justify-between gap-2 py-1.5 border-b border-[#e6dcc5] last:border-0">'
    + '<div><div class="font-black text-sm">' + t.icon + ' ' + t.name + '</div><div class="text-xs text-[#5c5346]">收藏獎盃</div></div>'
    + (state.trophies[t.id] ? '<span class="chip bg-[#1d6b41] text-white">已收藏</span>'
      : '<button type="button" onclick="buyTrophy(\'' + t.id + '\')" class="gold-btn text-xs px-3 py-1.5 whitespace-nowrap">' + fmt(t.price) + ' 金</button>')
    + '</div>').join('');
  $('spend-panel').innerHTML = '<h2 class="font-black text-base">💰 有錢花 <span class="text-xs font-bold text-[#5c5346]">贏來的錢，拿去變強、留名、收藏</span></h2>'
    + '<div class="mt-2">' + vipBtns + '</div>'
    + '<div class="mt-3"><div class="font-black text-sm">🏆 冠名 G1（' + fmt(NAMING_PRICE) + ' 金／' + NAMING_DAYS + ' 天）</div>'
    + (naming
      ? '<p class="text-xs text-[#5c5346] mt-1">「' + esc(state.namedRace.name) + '・天駒大賽」冠名中，剩 ' + (state.namedRace.untilDay - state.day + 1) + ' 天</p>'
      : '<div class="flex gap-1.5 mt-1.5"><input id="naming-input" type="text" maxlength="8" placeholder="盃名，例如：榮德盃" class="flex-1 min-w-0 text-sm font-bold border border-[#d8cbb3] rounded-lg px-2 py-1.5 bg-white"><button type="button" onclick="buyNaming(document.getElementById(\'naming-input\').value)" class="gold-btn text-xs px-3 py-1.5 whitespace-nowrap">冠名</button></div>')
    + '</div>'
    + '<div class="mt-3"><div class="font-black text-sm">🏆 獎盃收藏</div>' + trophyBtns + '</div>'
    + '<p class="text-xs text-[#5c5346] mt-2">買馬在下方圖鑑：點「買下」，那匹馬出賽奪冠你拿馬主獎金（冠軍 10 萬、G1 冠軍 50 萬、前三 3 萬）。</p>';
}
function renderRecords() {
  renderSpend();
  const s = state.stats;
  const hitRate = s.bets > 0 ? Math.round(s.hits / s.bets * 100) + '%' : '—';
  const pnl = s.returned - s.wagered;
  const cells = [
    ['下注場次', s.bets + ' 場'], ['命中率', hitRate], ['最高連勝', s.bestStreak + ' 連勝'],
    ['總投注', fmt(s.wagered)], ['總返還', fmt(s.returned)], ['總盈虧', (pnl >= 0 ? '+' : '') + fmt(pnl)],
  ];
  $('career-stats').innerHTML = cells.map(c => '<div class="bg-[#f4ede0] rounded-xl py-2"><div class="font-bold text-[#5c5346] text-xs">' + c[0] + '</div><div class="font-black text-sm">' + c[1] + '</div></div>').join('');
  $('collection-grid').innerHTML = HORSES.map(h => {
    const st = state.horseStats[h.id];
    const seen = st && st.races > 0;
    const owned = state.ownedHorseId === h.id;
    return '<div class="text-center ' + (seen ? '' : 'opacity-50') + '">'
      + (seen ? '<img src="' + COATS[h.coat].img + '" alt="" class="w-full aspect-square object-cover rounded-xl border border-[#d8cbb3] bg-[#f4ede0]">' : '<div class="w-full aspect-square rounded-xl border border-[#d8cbb3] bg-[#f4ede0] flex items-center justify-center text-2xl">❓</div>')
      + '<div class="text-[10px] font-bold mt-0.5 truncate">' + esc(h.name) + (owned ? ' 👑' : '') + '</div>'
      + '<div class="text-[10px] text-[#5c5346]">' + (seen ? st.wins + '勝/' + st.races + '戰' : '還沒出賽') + '</div>'
      + '<div class="text-[10px] text-[#5c5346]">速 ' + speedStat(h) + '・耐 ' + staminaStat(h) + '・爆 ' + kickStat(h) + '</div>'
      + (owned ? '<div class="text-[10px] font-black text-[#d9941a]">我的馬</div>'
        : '<button type="button" onclick="buyHorse(\'' + h.id + '\')" class="text-[10px] font-bold text-[#1d6b41] underline">買下 ' + fmt(ownerPrice(h.id)) + '</button>')
      + '</div>';
  }).join('');
  $('bet-log').innerHTML = state.logs.length ? state.logs.map(l => '<div>第' + l.day + '天：' + esc(l.text) + '</div>').join('') : '<div>還沒有投注紀錄。</div>';
}
function renderAll() {
  renderHeader();
  renderSchedule();
  renderBetSheet();
  if (currentView === 'records') renderRecords();
}

/* ================= 啟動 ================= */
window.addEventListener('load', () => {
  const loaded = loadState();
  if (loaded) { state = loaded; migrateState(); }
  else {
    const oldMoney = migratedMoney();
    state = createDefaultState(oldMoney >= 100000 ? oldMoney : 100000);
    if (oldMoney > 0) state.logs.unshift({ day: 1, text: '舊遊戲本金 ' + fmt(oldMoney) + ' 金已轉過來當下注本金。' });
    genDayRaces();
    saveState();
  }
  if (!state.races || !state.races.length || !state.races[0].weather) { genDayRaces(); saveState(); }
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('btn-mute').addEventListener('click', () => { setMuted(!isMuted()); sfx('tap'); });
  $('btn-work').addEventListener('click', doWork);
  setMuted(isMuted());
  renderAll();
});
</script>
</body>
</html>
